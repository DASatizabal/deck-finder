<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A3B">
<title>Deck Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deck Finder">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛳️</text></svg>">
<style>
:root{
  --bg:#EAF1F4; --surface:#FFFFFF; --ink:#0E2A3B; --muted:#5B7382;
  --line:#C6D6DE; --accent:#F26B1D; --accent-ink:#FFFFFF; --chip:#DCE8EE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B24; --surface:#13262F; --ink:#E3EDF2; --muted:#8FA7B4;
    --line:#26414F; --chip:#1B3441;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B24; --surface:#13262F; --ink:#E3EDF2; --muted:#8FA7B4;
  --line:#26414F; --chip:#1B3441;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.35;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 8px 14px}
.decktitle{flex:1;min-width:0}
.decktitle .word{font-size:13px;color:var(--muted);letter-spacing:.02em}
.decktitle .num{font-size:44px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.iconbtn:active{background:var(--chip)}
.iconbtn svg{width:24px;height:24px}

/* body */
.body{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr) 52px;gap:8px;padding:0 6px 0 12px;min-height:0}
.list{overflow-y:auto;min-height:0;padding:2px 2px 16px 0}
.list h2{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 6px}
.list ul{list-style:none;margin:0;padding:0}
.list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li.cabin{color:var(--accent);font-weight:700}
.list .note{font-size:13px;color:var(--muted);margin-top:10px}

.mapwrap{position:relative;min-height:0;background:#fff;border-radius:14px;border:1px solid var(--line);overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y}
.map{position:relative;width:100%;transition:width .2s ease}
.mapwrap.pinching .map{transition:none}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid #0E2A3B;box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(14,42,59,.35);animation:ping 1.6s ease-out 3}
@keyframes ping{0%{box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(14,42,59,.5)}100%{box-shadow:0 0 0 3px #fff,0 0 0 22px rgba(14,42,59,0)}}
.zoom{position:sticky;top:8px;float:right;margin:8px 8px -52px 0;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:22px;font-weight:700;opacity:.9}
.empty{padding:24px 16px;color:#33505F;font-size:15px}
.empty strong{display:block;font-size:18px;margin-bottom:6px;color:#0E2A3B}

/* slider */
.slider{position:relative;min-height:0;touch-action:none;user-select:none}
.track{position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.tick{position:absolute;right:0;left:0;height:0;display:flex;align-items:center;justify-content:flex-start}
.tick span{position:absolute;right:calc(50% + 8px);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.tick.on span{visibility:hidden}
.thumb{position:absolute;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:top .12s ease}
.slider.dragging .thumb{transition:none;transform:scale(1.12)}

/* footer */
.bottom{display:flex;align-items:center;gap:10px;padding:8px 14px 10px}
.shipname{flex:1;font-weight:600}
.cabinchip{background:var(--chip);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
.cabinchip b{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;z-index:11;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s ease;max-height:80%;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;font-size:17px}
.shipopt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.shipopt small{color:var(--muted)}
.shipopt.cur{font-weight:700}
.shiprow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.shiprow .shipopt{border-bottom:0;flex:1;min-width:0}
.offl{font-size:12px;color:var(--muted);white-space:nowrap;padding-right:4px}
.offl.ok{color:#2E8B57}
.dl{font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--chip);white-space:nowrap}
.shipopt.cur::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.results{overflow-y:auto;margin-top:8px;min-height:0}
.res{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.res span:last-child{color:var(--muted);white-space:nowrap;margin-left:12px}
.hint{color:var(--muted);font-size:13px;padding:10px 4px}

/* trip strip */
.strip{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:9px 12px;border-radius:12px;background:var(--chip);text-align:left;width:calc(100% - 24px)}
.strip .when{font-size:12px;color:var(--muted)}
.strip .what{font-weight:600}
.strip .grow{flex:1;min-width:0}
.strip .chev{color:var(--muted);font-size:18px}
/* menu + forms */
.menuopt{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.sectionlabel{font-size:13px;color:var(--muted);margin:16px 0 2px}
.scroll{overflow-y:auto;min-height:0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;margin-top:10px;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:#C0392B}
.btn:disabled{opacity:.5}
.status{font-size:14px;margin-top:10px;color:var(--muted)}
.status.err{color:#C0392B}
.trip{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.trip .grow{flex:1;min-width:0}
.trip small{color:var(--muted);display:block}
.trip .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.trip.active .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.trip .edit{padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px}
/* itinerary */
.day{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.day .d{width:74px;flex:none;font-size:13px;color:var(--muted)}
.day .p{font-weight:600}
.day .tm{font-size:13px;color:var(--muted)}
.day.today .d{color:var(--accent);font-weight:700}
.day.today .p{color:var(--accent)}
.src{font-size:12px;color:var(--muted);padding:0 4px 6px}
.dayrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.dayrow .d{width:74px;flex:none;font-size:13px;color:var(--muted)}
.dayrow .grow{flex:1;min-width:0}
.dayrow small{color:var(--muted);display:block;font-size:13px}
.dayrow .edit{padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px;flex:none}
.check{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:16px}
.check input{width:22px;height:22px;flex:none}
.timerow{display:flex;gap:8px;align-items:flex-end}
.timerow .field{flex:1;min-width:0}
.clr{padding:11px 12px;border-radius:10px;background:var(--chip);margin:10px 0;font-size:14px}
/* pin placement */
.placing .map{cursor:crosshair}
.placebar{position:sticky;top:0;z-index:3;background:var(--ink);color:var(--bg);padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.placebar .grow{flex:1}
.placebar button{background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:600}
/* update banner + version */
.updatebar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;z-index:9;display:block;padding:13px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.updatebar[hidden]{display:none}
.verline{font-size:13px;color:var(--muted);padding:14px 4px 2px}
.news{font-size:15px;padding:6px 4px 4px}
/* highlights and custom pins */
.lib{display:block;width:100%;text-align:left;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.hl{position:absolute;border:3px solid var(--accent);background:rgba(242,107,29,.25);border-radius:4px;animation:hlpulse 1.2s ease-in-out 5;cursor:pointer;z-index:1}
@keyframes hlpulse{0%,100%{box-shadow:0 0 0 0 rgba(242,107,29,.75)}50%{box-shadow:0 0 0 12px rgba(242,107,29,0)}}
.upin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;padding:0;z-index:2}
.upin span{font-size:11px;font-weight:700;background:var(--pc);color:#fff;padding:1px 6px;border-radius:8px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.upin i{display:block;width:18px;height:18px;border-radius:50%;background:var(--pc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
/* the plan's buttons sit in one row; each floating on its own made them stack on one spot */
.maptools{position:sticky;top:8px;float:right;margin:8px 8px -52px 0;z-index:2;display:flex;gap:6px}
.maptools .zoom{position:static;float:none;margin:0}
.zoom.addpin{font-size:18px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.pinrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.pinrow .dot{width:16px;height:16px;border-radius:50%;flex:none}
.pinrow .grow{flex:1;min-width:0;text-align:left}
.pinrow small{color:var(--muted);display:block}
/* layout: "wide" (plan fills the width, list in a sheet) is the default; without the class the
   old side-by-side columns apply unchanged. "full" hides everything but the plan and slider. */
.app.wide .body{grid-template-columns:minmax(0,1fr) 44px;gap:6px;padding:0 4px 0 8px}
.listbtn{position:sticky;top:8px;left:8px;float:left;margin:8px 0 -52px 8px;z-index:2;height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;opacity:.92}
.zoom.fullbtn{font-size:18px}
.app.full{grid-template-rows:1fr;max-width:none}
.app.full > div:first-child, .app.full > footer{display:none}
.app.full .body{padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
#listSheet .list{overflow:visible;padding:0}
.layoutopt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.layoutopt small{color:var(--muted);display:block}
.layoutopt.cur{font-weight:700}
.layoutopt.cur::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.placeline{position:absolute;left:0;right:0;height:0;border-top:2px solid rgba(242,107,29,.7);pointer-events:none;z-index:1;animation:placefade 2s ease-out forwards}
@keyframes placefade{0%{opacity:1}60%{opacity:.6}100%{opacity:0}}
/* island map: drawn from basemap.json (no map tiles), markers and the blue dot on top */
:root{--sea:#BFE3F0;--land:#E4EED3;--shore:#9DB88A;--beach:#F6E7B9;--water:#8FD0EA;--bldg:#CFC6B6;--road:#FFFFFF;--path:#A9855A;--pier:#9AA5AB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sea:#0E3446;--land:#243A2C;--shore:#3F5E47;--beach:#4D4632;--water:#1F5F7A;--bldg:#57544D;--road:#7C8B91;--path:#B39168;--pier:#6F7B80}}
:root[data-theme="dark"]{--sea:#0E3446;--land:#243A2C;--shore:#3F5E47;--beach:#4D4632;--water:#1F5F7A;--bldg:#57544D;--road:#7C8B91;--path:#B39168;--pier:#6F7B80}
.island{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.island[hidden]{display:none}
.itop{display:flex;align-items:center;gap:4px;padding:6px 8px}
.itop h2{flex:1;min-width:0;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aboard{margin:0 10px 6px;padding:8px 12px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px}
.aboard[hidden]{display:none}
.aboard.warn{background:#E67E22;color:#fff}.aboard.late{background:#C0392B;color:#fff}.aboard.info{font-weight:400;color:var(--muted)}
.imap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:var(--sea);user-select:none;-webkit-user-select:none}
#isvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#isvg path,#isvg circle,#isvg line{vector-effect:non-scaling-stroke}
.g-land{fill:var(--land);stroke:var(--shore);stroke-width:1.2}
.g-beach{fill:var(--beach);stroke:none}
.g-water{fill:var(--water);stroke:none}
.g-bldg{fill:var(--bldg);stroke:rgba(0,0,0,.18);stroke-width:.6}
.g-pier{fill:var(--pier);stroke:none}
.g-pierl{fill:none;stroke:var(--pier);stroke-width:3;stroke-linecap:round}
.g-road{fill:none;stroke:var(--road);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-path{fill:none;stroke:var(--path);stroke-width:1.5;stroke-dasharray:4 3;stroke-linecap:round}
.o-acc{fill:rgba(26,115,232,.15);stroke:rgba(26,115,232,.5);stroke-width:1}
.o-walk{fill:none;stroke:#D6336C;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.o-back{stroke:var(--accent);stroke-width:4;stroke-dasharray:8 6;stroke-linecap:round}
.imarks{position:absolute;inset:0;pointer-events:none}
.imarks > *{pointer-events:auto}
.mk{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35);z-index:1}
.mk i{font-style:normal;font-size:15px;line-height:1}
.mk span,.svmk span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.92);color:#0E2A3B;padding:0 5px;border-radius:6px;display:none}
.imap.labels .mk span,.imap.labels .svmk span,.mk.sel span,.mk.spotmk span,.svmk.sel span{display:block}
.mk.approx{border-style:dashed;background:rgba(255,255,255,.8)}
.mk.sel{z-index:3}
.mk.hot{animation:hlpulse 1.2s ease-in-out 5;box-shadow:0 0 0 3px var(--accent)}
.mk.spotmk{--c:#8E44AD;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:2}
.svmk{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;padding:0;border-radius:3px;background:var(--c);border:2px solid #fff;transform-origin:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.svmk.new{border-radius:50%;background:#fff;border:3px solid #D6336C}
.me{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 1px 5px rgba(0,0,0,.4);z-index:4;pointer-events:none}
.me[hidden]{display:none}
.itopstack{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.itopstack > *{pointer-events:auto}
.ibanner{background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:14px}
.ibanner[hidden]{display:none}
.ibanner b{display:block;font-size:15px}
.ibanner button{margin-top:6px;font-weight:700;text-decoration:underline}
.recbar{display:flex;align-items:center;gap:8px;background:#D6336C;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.recbar[hidden]{display:none}
.recbar .grow{flex:1}
.recbar button{background:#fff;color:#D6336C;border-radius:8px;padding:6px 10px}
.itools{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}
.itools .zoom{position:static;float:none;margin:0}
.ibottom{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.ibottom > *{pointer-events:auto}
.iattr{align-self:flex-end;font-size:11px;background:rgba(255,255,255,.85);color:#33505F;padding:1px 6px;border-radius:6px}
.iattr a{color:inherit}
.ibar{display:flex;gap:6px}
.ibar button{flex:1;padding:12px 6px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ibar button.on{background:var(--accent);color:var(--accent-ink)}
.icard,.backpanel{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.icard[hidden],.backpanel[hidden]{display:none}
.icard .row,.backpanel .row{display:flex;align-items:flex-start;gap:10px}
.icard .grow,.backpanel .grow{flex:1;min-width:0}
.icard small,.backpanel small{display:block;color:var(--muted);font-size:13px}
.icard .x,.backpanel .x{font-size:15px;padding:4px 8px;border-radius:8px;background:var(--chip);flex:none}
.icard .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.icard .acts button{padding:8px 10px;border-radius:8px;background:var(--chip);font-weight:600;font-size:14px}
.backpanel .arrow{width:64px;height:64px;flex:none;transition:transform .15s linear}
.backpanel .dist{font-size:22px;font-weight:700}
.imsg{position:absolute;inset:0;z-index:7;background:var(--bg)}
.imsg[hidden]{display:none}
.stripwrap{display:flex;gap:6px;margin:0 12px 8px}
.stripwrap .strip{margin:0;width:auto;flex:1;min-width:0}
.stripisl{flex:none;padding:0 12px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}

<body>
<div class="app">
  <div>
  <header class="top">
    <div class="decktitle"><div class="word">Deck</div><div class="num" id="deckNum">5</div></div>
    <button class="iconbtn" id="findBtn" aria-label="Find a place or cabin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>

<script>
const APP_VERSION = "1.10.1";
const APP_DATE = "2026-09-28";

// ---------- ships: loaded at runtime from ships/index.json and each ship's ship.json ----------
let CATALOG = [];       // every ship in ships/index.json: {id, name, path, decks, bytes, hash, line, lineName}
let catalogReady = false;
const SHIPS = {};       // ship id ("ncl/getaway") -> its ship.json, once loaded
const shipLoads = {};   // ship id -> load in progress
const shipErrors = {};  // ship id -> true when it couldn't load (offline and not saved)
const SAVED = {};       // ship id -> hash of the copy saved for offline
const downloading = {}; // ship id -> true while downloading for offline
const dlFailed = {};    // ship id -> true when the last download failed
const LEGACY_SHIPS = { getaway: "ncl/getaway", joy: "ncl/joy", aqua: "ncl/aqua" };
const NOT_SAVED_MSG = "This ship isn't saved on your phone yet. Connect to the internet and tap Download for offline.";
const catEntry = id => CATALOG.find(x => x.id === id) || null;
const shipName = id => SHIPS[id]?.name || catEntry(id)?.name || "";
const shipCacheName = id => "deckfinder-ship-" + String(id).replace("/", "-");
const absUrl = path => new URL(path, location.href).href;

// ---------- deck geometry: ships/<line>/<ship>/geometry.json, when the ship's ship.json names one ----------
// Boxes are [left, top, right, bottom] in percent of the plan image, like the cabin pin.
// Ships without geometry (no "geometry" in ship.json) keep working exactly as before.
const GEO = {};          // ship id -> geometry, or null when the ship has none
async function loadGeo(id, sh){
  if (GEO[id] !== undefined) return GEO[id];
  const entry = catEntry(id);
  if (!sh || !sh.geometry || !entry) return (GEO[id] = null);
  try {
    const r = await fetch(entry.path + sh.geometry);
    GEO[id] = r.ok ? await r.json() : null;
  } catch (e) { delete GEO[id]; return null; }  // offline and not saved: try again later
  return GEO[id];
}
function geoDeck(id, deck){ return GEO[id]?.decks?.[String(deck)] || null; }
// The cabin with this number, or the cabin whose deck plan label is this (misprinted) number.
function geoCabin(id, number){
  const n = String(number || "").trim(); const d = cabinDeckNum(n); if (!d) return null;
  const cs = geoDeck(id, d)?.cabins || [];
  return cs.find(c => c.number === n) || cs.find(c => c.printed_as === n) || null;
}
const STOP = new Set(["the", "and", "at", "on", "of", "a", "&"]);
function normName(x){ return String(x).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
function nameTokens(x){ return normName(x).split(" ").filter(w => w && !STOP.has(w)); }
function sameVenue(a, b){
  const na = normName(a), nb = normName(b);
  if (na === nb || na.replace(/ /g, "") === nb.replace(/ /g, "")) return true;
  const ta = nameTokens(a), tb = nameTokens(b);
  if (ta.length < 2 || tb.length < 2) return false;      // one-word names must match exactly
  return ta.filter(w => tb.includes(w)).length / new Set([...ta, ...tb]).size >= 0.5;
}
function venueBoxes(id, deck, name){
  const vs = geoDeck(id, deck)?.venues || [];
  const exact = vs.filter(v => normName(v.name) === normName(name));
  const found = exact.length ? exact : vs.filter(v => sameVenue(v.name, name));
  if (found.length) return found.map(v => v.box);
  // A listed name like "Pool" is stored as an amenity in the geometry: highlight those.
  return amenityBoxes(id, deck, name);
}
function amenityBoxes(id, deck, name){
  return (geoDeck(id, deck)?.amenities || []).filter(a => normName(a.kind) === normName(name) || sameVenue(a.kind, name)).map(a => a.box);
}
const boxCenter = b => ({ x: (b[0] + b[2]) / 2, y: (b[1] + b[3]) / 2 });
// Where the cabin pin goes: a pin placed by hand wins, otherwise the center of the cabin's box.
function cabinPoint(trip){
  if (trip.pin) return trip.pin;
  const c = geoCabin(trip.ship, trip.cabin);
  return c ? boxCenter(c.box) : null;
}
// ---------- layout: "wide" (default) or "columns" (the side-by-side view from before 1.7.0) ----------
// Saved as state.layout, an added field: a phone without it gets "wide".
let fullScreen = false;  // full screen is never saved; the app always opens normally
const isWide = () => state.layout !== "columns";
function applyLayout(){
  const app = document.querySelector(".app"), list = $("list");
  app.classList.toggle("wide", isWide());
  app.classList.toggle("full", fullScreen);
  // The one "On this deck" list moves between the page (columns) and its sheet (wide).
  if (isWide() && list.parentElement !== $("listHolder")) $("listHolder").appendChild(list);
  if (!isWide() && list.parentElement !== document.querySelector(".body")) document.querySelector(".body").insertBefore(list, $("mapwrap"));
}
function setLayout(layout){ state.layout = layout; closeSheets(); save(); render(); }
function toggleFullScreen(){
  fullScreen = !fullScreen;
  // Use the phone's real full screen where the browser allows it (Android); iPhones just hide the bars.
  try {
    if (fullScreen && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    if (!fullScreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) {}
  render();
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && fullScreen) { fullScreen = false; render(); } });

let highlight = null;    // { ship, deck, boxes } shown as pulsing boxes; kept in memory only
let addingPin = null;    // null, "new", or the id of a pin being moved
// Smoothly center the plan on a point given in percent, once the image has its size.
function scrollToPct(x, y){
  const map = $("map"), wrap = $("mapwrap"); if (!map) return;
  const img = map.querySelector("img");
  const go = () => wrap.scrollTo({
    top: Math.max(0, map.offsetTop + y / 100 * map.offsetHeight - wrap.clientHeight / 2),
    left: Math.max(0, map.offsetLeft + x / 100 * map.offsetWidth - wrap.clientWidth / 2),
    behavior: "smooth" });
  // Wait one frame so the new layout exists. Some browsers pause frames (a hidden tab),
  // so a short timer runs it anyway, and it only ever runs once.
  let done = false;
  const once = () => { if (!done) { done = true; go(); } };
  const soon = () => { requestAnimationFrame(once); setTimeout(once, 120); };
  if (img && !img.complete) Promise.race([img.decode(), new Promise(r => setTimeout(r, 800))]).then(soon, soon);
  else soon();
}
async function showBoxes(id, deck, boxes){
  state.ship = id; state.deck = deck;
  try { await ensureShip(id); } catch (e) {}
  highlight = { ship: id, deck, boxes };
  const b = boxes[0];
  if (b && (b[2] - b[0]) < 25 && state.zoom < 2) state.zoom = 2.2;   // small targets: zoom in
  render();
  if (b){ const c = boxCenter(b); scrollToPct(c.x, c.y); }
}
function highlightVenue(id, deck, name){
  const boxes = venueBoxes(id, deck, name);
  if (boxes.length) showBoxes(id, deck, boxes); else { state.deck = deck; highlight = null; render(); }
}

// ---------- custom pins: a "pins" array on each trip, saved with the trips ----------
const PIN_COLORS = ["#8E44AD", "#E74C3C", "#27AE60", "#2980B9", "#F39C12", "#16A085"];
function tripPins(){ const t = activeTrip(); return t ? (t.pins || (t.pins = [])) : []; }
async function goToPin(pid){
  const p = tripPins().find(x => x.id === pid); if (!p) return;
  state.ship = p.ship; state.deck = p.deck; highlight = null;
  try { await ensureShip(p.ship); } catch (e) {}
  if (state.zoom < 2) state.zoom = 2.2;
  render(); scrollToPct(p.x, p.y);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- saved data (stays on this phone) ----------
let state = { ship: "ncl/getaway", deck: 5, zoom: 1 };
let data = { trips: [], activeTripId: null, workerUrl: "", passphrase: "" };
try {
  const s = JSON.parse(localStorage.getItem("deckfinder") || "null");
  if (s && typeof s === "object") state = Object.assign(state, s);
  if (typeof state.zoom !== "number") state.zoom = state.zoomed ? 2.2 : 1;
  delete state.zoomed;
  const d = JSON.parse(localStorage.getItem("deckfinder-trips") || "null");
  if (d && Array.isArray(d.trips)) data = Object.assign(data, d);
} catch (e) {}
function save(){
  try {
    localStorage.setItem("deckfinder", JSON.stringify(state));
    localStorage.setItem("deckfinder-trips", JSON.stringify(data));
  } catch (e) {}
}
// Migration (1.5.0): ship keys became "line/ship", like "ncl/getaway". Safe to run any number of times.
function migrateShipIds(){
  let changed = false;
  const fix = v => { if (LEGACY_SHIPS[v]) { changed = true; return LEGACY_SHIPS[v]; } return v; };
  state.ship = fix(state.ship);
  data.trips.forEach(t => { t.ship = fix(t.ship); });
  if (changed) save();
}
migrateShipIds();
let placing = null; // trip id while placing a cabin pin

function activeTrip(){ return data.trips.find(t => t.id === data.activeTripId) || null; }
function deckList(shipKey){ const sh = SHIPS[shipKey]; return sh ? Object.keys(sh.decks).map(Number).sort((a,b)=>a-b) : []; }
function hasPlans(shipKey){ return deckList(shipKey).length > 0; }
// Works before a ship is loaded, using the deck count from ships/index.json.
function shipHasDecks(shipKey){ return SHIPS[shipKey] ? hasPlans(shipKey) : (catEntry(shipKey)?.decks || 0) > 0; }

// ---------- loading ships and saving them for offline ----------
async function loadCatalog(){
  const r = await fetch("ships/index.json");
  if (!r.ok) throw new Error("ships/index.json answered " + r.status);
  const idx = await r.json();
  CATALOG = idx.lines.flatMap(l => l.ships.map(x => Object.assign({ line: l.id, lineName: l.name }, x)));
  PLACES = Array.isArray(idx.places) ? idx.places : [];   // island maps, added in 1.10.0
  catalogReady = true;
}
function ensureShip(id){
  if (SHIPS[id]) return Promise.resolve(SHIPS[id]);
  if (shipLoads[id]) return shipLoads[id];
  const entry = catEntry(id);
  if (!entry) return Promise.reject(new Error("that ship isn't in the app"));
  delete shipErrors[id];
  shipLoads[id] = fetch(entry.path + "ship.json")
    .then(r => { if (!r.ok) throw new Error("ship.json answered " + r.status); return r.json(); })
    .then(sh => loadGeo(id, sh).then(() => { SHIPS[id] = sh; return sh; }))
    .catch(e => { shipErrors[id] = true; throw e; })
    .finally(() => { delete shipLoads[id]; });
  return shipLoads[id];
}
async function refreshSaved(){
  if (!("caches" in window)) return;
  for (const x of CATALOG){
    try {
      const hit = await caches.match(absUrl(x.path + "saved.json"), { cacheName: shipCacheName(x.id) });
      if (hit) SAVED[x.id] = (await hit.json()).hash; else delete SAVED[x.id];
    } catch (e) {}
  }
  await refreshSavedPlaces();
}
// Download ship.json and every deck image, then store them together as one unit.
// saved.json is written last, so a download cut off halfway never counts as saved.
async function saveShip(id){
  if (!("caches" in window) || downloading[id]) return;
  const entry = catEntry(id); if (!entry) return;
  downloading[id] = true; delete dlFailed[id]; refreshMenu();
  try {
    const bust = "?v=" + entry.hash.slice(0, 12); // the ?v= tells sw.js to go to the network
    const get = async f => { const r = await fetch(entry.path + f + bust, { cache: "no-store" }); if (!r.ok) throw new Error(f + " answered " + r.status); return r; };
    const shipRes = await get("ship.json");
    const sh = await shipRes.clone().json();
    const files = [...new Set([...Object.values(sh.decks).map(d => d.image), ...(sh.geometry ? [sh.geometry] : [])])];
    const imgs = await Promise.all(files.map(async f => [f, await get(f)]));
    await caches.delete(shipCacheName(id));
    const c = await caches.open(shipCacheName(id));
    await c.put(absUrl(entry.path + "ship.json"), shipRes);
    for (const [f, r] of imgs) await c.put(absUrl(entry.path + f), r);
    await c.put(absUrl(entry.path + "saved.json"), new Response(JSON.stringify({ hash: entry.hash, saved: new Date().toISOString() }), { headers: { "Content-Type": "application/json" } }));
    delete GEO[id]; await loadGeo(id, sh);
    SAVED[id] = entry.hash; SHIPS[id] = sh; delete shipErrors[id];
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    dlFailed[id] = true; throw e;
  } finally { delete downloading[id]; refreshMenu(); }
}
// Save the ship of every trip, and refresh any saved ship whose files changed on the website.
async function syncOfflineShips(){
  syncOfflinePlaces();   // island maps for island days on the trips
  if (!catalogReady || !("caches" in window) || !navigator.onLine) return;
  const tripShips = new Set(data.trips.map(t => t.ship));
  for (const x of CATALOG){
    const saved = SAVED[x.id];
    if ((tripShips.has(x.id) && !saved) || (saved && saved !== x.hash)){
      try { await saveShip(x.id); if (x.id === state.ship) render(); } catch (e) {}
    }
  }
}
function imgFailed(){
  $("mapwrap").innerHTML = `<div class="empty"><strong>${SAVED[state.ship] ? "Deck plan didn't load" : "Not saved yet"}</strong>${SAVED[state.ship] ? "Close the app and open it again." : NOT_SAVED_MSG}</div>`;
}
function cabinDeckNum(cabin){
  const c = String(cabin || "").trim();
  if (/^\d{5}$/.test(c)) return parseInt(c.slice(0,2),10);
  if (/^\d{4}$/.test(c)) return parseInt(c.slice(0,1),10);
  return null;
}

// ---------- dates ----------
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function niceDate(iso){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y,m-1,d)); return DOW[dt.getUTCDay()]+", "+MON[m-1]+" "+d; }
function niceTime(hhmm){ if (!hhmm) return ""; let [h,m] = hhmm.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function dayLine(day){
  if (day.sea) return "At sea";
  const bits = [];
  if (day.kind === "embark") return day.port+(day.depart ? ", sails "+niceTime(day.depart) : "");
  if (day.kind === "debark") return day.port+(day.arrive ? ", arrive "+niceTime(day.arrive) : "");
  if (day.arrive && day.depart) return day.port+", "+niceTime(day.arrive)+" to "+niceTime(day.depart);
  return day.port;
}

// ---------- main render ----------
function render(){
  applyLayout();
  const trip = activeTrip();
  $("shipName").textContent = shipName(state.ship);
  renderStrip();

  const chip = $("cabinChip");
  if (trip && trip.ship === state.ship && trip.cabin){ chip.hidden = false; chip.innerHTML = `Cabin <b>${esc(trip.cabin)}</b>`; }
  else chip.hidden = true;

  const ship = SHIPS[state.ship];
  if (!ship){
    $("deckNum").textContent = "–"; $("list").innerHTML = ""; $("slider").innerHTML = "";
    $("mapwrap").dataset.key = "";
    $("mapwrap").innerHTML = catalogReady && shipErrors[state.ship]
      ? `<div class="empty"><strong>Not saved yet</strong>${NOT_SAVED_MSG}</div>`
      : `<div class="empty">Loading deck plans...</div>`;
    if (catalogReady && !shipErrors[state.ship]) ensureShip(state.ship).then(render, render);
    save(); return;
  }
  const decks = deckList(state.ship);

  if (!decks.length){
    $("deckNum").textContent = "–";
    $("list").innerHTML = trip && trip.ship === state.ship ? `<h2>Your cabin</h2><ul><li class="cabin">${esc(trip.cabin)} on deck ${cabinDeckNum(trip.cabin) ?? "?"}</li></ul>` : "";
    $("mapwrap").innerHTML = `<div class="empty"><strong>No deck plans yet</strong>Deck plans for ${ship.name} haven't been added to the app. Your trip and itinerary still work.</div>`;
    $("slider").innerHTML = "";
    save(); return;
  }
  if (!decks.includes(state.deck)) state.deck = decks[0];
  const d = state.deck;
  $("deckNum").textContent = d;

  const mineHere = trip && trip.ship === state.ship && cabinDeckNum(trip.cabin) === d;
  const items = ship.decks[d].venues;
  const pinsHere = trip && trip.ship === state.ship ? (trip.pins || []).filter(p => p.ship === state.ship && p.deck === d) : [];
  // Venues with a box on the plan are buttons that highlight it. Amenities are not listed here.
  $("list").innerHTML = `<h2>On this deck</h2><ul>${mineHere ? `<li class="cabin"><button class="lib" data-cabin="1">Your cabin ${esc(trip.cabin)}</button></li>` : ""}${items.map(i =>
      `<li>${venueBoxes(state.ship, d, i).length ? `<button class="lib" data-name="${esc(i)}">${esc(i)}</button>` : esc(i)}</li>`).join("")}</ul>${
      pinsHere.length ? `<h2>My pins</h2><ul>${pinsHere.map(p => `<li><button class="lib" data-gopin="${esc(p.id)}" style="color:${esc(p.color)}">${esc(p.label)}</button></li>`).join("")}</ul>` : ""}`;
  $("list").querySelectorAll("[data-name]").forEach(b => b.onclick = () => { closeSheets(); highlightVenue(state.ship, d, b.dataset.name); });
  $("list").querySelectorAll("[data-cabin]").forEach(b => b.onclick = () => { closeSheets(); $("cabinChip").onclick(); });
  $("list").querySelectorAll("[data-gopin]").forEach(b => b.onclick = () => { closeSheets(); goToPin(b.dataset.gopin); });

  const key = state.ship + ":" + d;

// ---------- keep your place when changing decks ----------
// Each deck's ship_extent says where the ship's drawing starts and ends on its image, so the
// same fraction of the ship's length can be found on any deck (the first guess). On ships
// with geometry, elevator banks that line up between the two decks act as anchor points and
// correct that guess. Jumps to a specific target (search, list taps, cabin chip, My pins) set
// the deck directly and never come through here.
const BANK_GAP = 0.04;      // elevators closer than 4% of the ship's length form one bank
const ANCHOR_MAX = 0.03;    // a bank matches the nearest bank on the other deck within 3%
function extentOf(id, d){
  const e = SHIPS[id]?.decks?.[String(d)]?.ship_extent;
  return e && e.bottom > e.top ? e : { top: 0, bottom: 100 };
}
function toFrac(id, d, yPct){ const e = extentOf(id, d); return (yPct - e.top) / (e.bottom - e.top); }
function fromFrac(id, d, f){ const e = extentOf(id, d); return e.top + f * (e.bottom - e.top); }
function elevatorBanks(id, d){
  const ys = (geoDeck(id, d)?.landmarks || []).filter(l => l.kind === "elevator")
    .map(l => toFrac(id, d, (l.box[1] + l.box[3]) / 2)).sort((a, b) => a - b);
  const out = []; let cur = [];
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  for (const y of ys){ if (cur.length && y - cur[cur.length - 1] > BANK_GAP){ out.push(avg(cur)); cur = []; } cur.push(y); }
  if (cur.length) out.push(avg(cur));
  return out;
}
// Map a fraction of the ship's length on deck `from` to deck `to`.
function mapFraction(id, from, to, f){
  const a = elevatorBanks(id, from), b = elevatorBanks(id, to);
  const anchors = [];
  for (const x of a){
    let best = null;
    for (const y of b) if (best === null || Math.abs(y - x) < Math.abs(best - x)) best = y;
    if (best !== null && Math.abs(best - x) <= ANCHOR_MAX && (!anchors.length || best > anchors[anchors.length - 1][1]))
      anchors.push([x, best]);
  }
  if (!anchors.length) return f;                                   // no anchors: keep the first guess
  const first = anchors[0], last = anchors[anchors.length - 1];
  if (f <= first[0]) return f + (first[1] - first[0]);             // before the first anchor: shift
  if (f >= last[0]) return f + (last[1] - last[0]);                // after the last anchor: shift
  for (let i = 0; i + 1 < anchors.length; i++){
    const [x0, y0] = anchors[i], [x1, y1] = anchors[i + 1];
    if (f >= x0 && f <= x1) return y0 + (f - x0) * (y1 - y0) / (x1 - x0);   // straight line between anchors
  }
  return f;
}
let placeToken = 0, pendingPlace = null;   // a deck change still waiting for its plan image
// The spot at the center of the visible plan, in percent of the image, and the side-to-side scroll.
function viewSpot(){
  if (pendingPlace) return { deck: pendingPlace.deck, y: pendingPlace.y, left: pendingPlace.left };
  const map = $("map"), wrap = $("mapwrap");
  if (!map || !map.offsetHeight) return null;
  return { deck: state.deck, y: (wrap.scrollTop + wrap.clientHeight / 2 - map.offsetTop) / map.offsetHeight * 100, left: wrap.scrollLeft };
}
function keepPlace(id, spot, to){
  const f = mapFraction(id, spot.deck, to, toFrac(id, spot.deck, spot.y));
  const y = Math.min(100, Math.max(0, fromFrac(id, to, f)));
  pendingPlace = { ship: id, deck: to, y, left: spot.left, token: ++placeToken };
  armPendingPlace();
}
// Scroll once the new deck's image has its size; the same zoom and side-to-side position stay.
function armPendingPlace(){
  const pp = pendingPlace; if (!pp) return;
  const img = $("map")?.querySelector("img");
  const apply = () => {
    if (pendingPlace !== pp || pp.token !== placeToken) return;
    pendingPlace = null;
    const map = $("map"), wrap = $("mapwrap"); if (!map) return;
    wrap.scrollTop = Math.max(0, map.offsetTop + pp.y / 100 * map.offsetHeight - wrap.clientHeight / 2);
    wrap.scrollLeft = pp.left;
    const line = document.createElement("div");
    line.className = "placeline"; line.style.top = pp.y + "%";
    map.appendChild(line);
    setTimeout(() => line.remove(), 2300);
  };
  if (img && !img.complete){
    img.addEventListener("load", apply, { once: true });
    img.addEventListener("error", () => { if (pendingPlace === pp) pendingPlace = null; }, { once: true });
  } else apply();
}
(function(){
  const s = $("slider"); let dragging = false;
  s.addEventListener("pointerdown", e => { if (!hasPlans(state.ship)) return; dragging = true; s.classList.add("dragging"); s.setPointerCapture(e.pointerId); setDeck(deckFromY(e.clientY)); });
  s.addEventListener("pointermove", e => { if (dragging) setDeck(deckFromY(e.clientY)); });
  const end = () => { dragging = false; s.classList.remove("dragging"); };

    if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); if (i > 0) setDeck(decks[i-1]); }
  });
})();

// ---------- pinch to zoom the deck plan (two fingers, or ctrl + trackpad pinch) ----------
(function(){
  const wrap = $("mapwrap");
  const MIN = 1, MAX = 5;
  let g = null;
  const clamp = z => Math.min(MAX, Math.max(MIN, z));
  // Zoom to z, keeping the plan point under screen point (px, py) fixed.
  function zoomAt(z, px, py, from){
    const map = $("map"); if (!map) return;
    const r = wrap.getBoundingClientRect();
    const cx = (from.left + px - r.left - map.offsetLeft) / from.zoom;
    const cy = (from.top + py - r.top - map.offsetTop) / from.zoom;
    state.zoom = clamp(z);
    map.style.width = state.zoom * 100 + "%";
    wrap.scrollLeft = cx * state.zoom + map.offsetLeft - (px - r.left);
    wrap.scrollTop = cy * state.zoom + map.offsetTop - (py - r.top);
  }
  function syncBtn(){
    const b = $("zoomBtn"); if (!b) return;
    b.textContent = state.zoom > 1 ? "−" : "+";
    b.setAttribute("aria-label", state.zoom > 1 ? "Zoom out" : "Zoom in");
  }
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
  wrap.addEventListener("touchstart", e => {
    if (e.touches.length !== 2 || !$("map")) return;
    const [mx, my] = mid(e.touches);
    g = { d: dist(e.touches), mx, my, zoom: state.zoom, left: wrap.scrollLeft, top: wrap.scrollTop };
    wrap.classList.add("pinching");
  }, { passive: true });
  wrap.addEventListener("touchmove", e => {
    if (!g || e.touches.length !== 2) return;
    e.preventDefault();
    const [mx, my] = mid(e.touches);
    // Anchor on the starting midpoint, then follow the fingers as they move.
    zoomAt(g.zoom * dist(e.touches) / g.d, g.mx, g.my, g);
    wrap.scrollLeft -= mx - g.mx; wrap.scrollTop -= my - g.my;
  }, { passive: false });
  const end = e => {
    if (!g || e.touches.length >= 2) return;
    g = null; wrap.classList.remove("pinching");
    if (state.zoom < 1.05) { state.zoom = 1; const m = $("map"); if (m) m.style.width = "100%"; }
    syncBtn(); save();
  };
  wrap.addEventListener("touchend", end); wrap.addEventListener("touchcancel", end);
  wrap.addEventListener("wheel", e => {
    if (!e.ctrlKey || !$("map")) return;
    e.preventDefault();
    wrap.classList.add("pinching");
    zoomAt(state.zoom * Math.exp(-e.deltaY / 100), e.clientX, e.clientY, { zoom: state.zoom, left: wrap.scrollLeft, top: wrap.scrollTop });
    wrap.classList.remove("pinching");
    syncBtn(); clearTimeout(wrap._zt); wrap._zt = setTimeout(save, 300);
  }, { passive: false });
})();

// Sort the days and mark the first as boarding day and the last as the day you get off.
function normalizeDays(days){
  const out = days.slice().sort((a, b) => a.date.localeCompare(b.date))
    .map(d => d.sea ? { date: d.date, sea: true } : Object.assign({ date: d.date, kind: "port", port: d.port, arrive: d.arrive || "", depart: d.depart || "" }, d.code ? { code: d.code } : {}));
  if (out.length && !out[0].sea) out[0].kind = "embark";
  if (out.length > 1 && !out[out.length - 1].sea) out[out.length - 1].kind = "debark";
  return out;
}

// ---------- itinerary lookup (through the Cloudflare Worker) ----------
async function getText(url, timeoutMs){
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), timeoutMs || 60000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) { const e = new Error("NCL answered " + r.status); e.status = r.status; throw e; }
    return await r.text();
  } catch (e) {
    if (e.name === "AbortError") throw new Error("the lookup timed out. Try again on a faster connection.");
    throw e;
  } finally { clearTimeout(timer); }
}
// Ask NCL directly first. If that fails and a backup helper (Cloudflare Worker) is saved, try through it.
async function viaWorker(path, timeoutMs){
  try { return await getText("https://www.ncl.com" + path, timeoutMs); }
  catch (direct) {
    if (!data.workerUrl) {
      if (direct instanceof TypeError) throw new Error("couldn't reach NCL. Check your internet connection.");
      throw direct;
    }
    try { return await getText(data.workerUrl.replace(/\/+$/,"") + "/?path=" + encodeURIComponent(path), timeoutMs); }
    catch (e) {
      if (e instanceof TypeError) throw new Error("couldn't reach NCL or the backup helper. Check your internet connection.");
      throw e;
    }
  }
}
function parseCruisePage(raw){
  const t = raw.replaceAll("&quot;", '"').replaceAll("&amp;", "&").replaceAll("&#39;", "'");
  const sailings = [...t.matchAll(/"packageId":(\d+),"sailId":(\d+),"departureDate":(\d+),"returnDate":(\d+)/g)]
    .map(m => ({ dep: +m[3], ret: +m[4] }));
  const events = [...t.matchAll(/"date":(\d+),"portCode":"([^"]*)","portName":"([^"]*)"(?:,"portTag":"[^"]*")?,"event":"([A-Z])"/g)]
    .map(m => ({ ts: +m[1], code: m[2], name: m[3], ev: m[4] }));
  return { sailings, events };
}
function buildDays(sail, events, target){
  // NCL stores port times as local clock time written in UTC, so read them back in UTC.
  const nights = Math.round((sail.ret - sail.dep) / 86400000);
  const days = [];
  for (let i = 0; i <= nights; i++){
    const dayStart = target + i * 86400000, dayEnd = dayStart + 86400000;
    const evs = events.filter(e => e.ts >= dayStart && e.ts < dayEnd);
    const iso = new Date(dayStart).toISOString().slice(0,10);
    const hhmm = ts => new Date(ts).toISOString().slice(11,16);
    const a = evs.find(e => e.ev === "A" && e.code), d = evs.find(e => e.ev === "D" && e.code);
    const port = (a || d)?.name;
    const code = (a || d)?.code;   // NCL's port code, like NPI for Great Stirrup Cay (added in 1.10.0)
    const withCode = day => code ? Object.assign(day, { code }) : day;
    if (i === 0) days.push(withCode({ date: iso, kind: "embark", port: d?.name || port || "Embark", depart: d ? hhmm(d.ts) : "" }));
    else if (i === nights) days.push(withCode({ date: iso, kind: "debark", port: a?.name || port || "Debark", arrive: a ? hhmm(a.ts) : "" }));
    else if (!port) days.push({ date: iso, sea: true });
    else days.push(withCode({ date: iso, kind: "port", port, arrive: a ? hhmm(a.ts) : "", depart: d ? hhmm(d.ts) : "" }));
  }
  return days;
}
async function lookupItinerary(shipKey, dateIso, progress){
  const ship = await ensureShip(shipKey);
  const code = ship.itinerary_code, name = ship.name;
  const [y, m, d] = dateIso.split("-").map(Number);
  const target = Date.UTC(y, m - 1, d);
  progress("Searching " + name + " sailings in " + MON[m-1] + " " + y + "...");
  let search;
  try { search = JSON.parse(await viaWorker(`/api/v2/vacations/search?limit=50&offset=0&ships=${code}&dates=${MON[m-1]}-${y}`)); }
  catch (e) { if (e instanceof SyntaxError) throw new Error("NCL sent back something unexpected."); throw e; }
  const its = search.itineraries || [];
  if (!its.length) throw new Error("NCL shows no " + name + " sailings in " + MON[m-1] + " " + y + ".");
  for (let i = 0; i < its.length; i++){
    const it = its[i];
    progress(`Checking itinerary ${i+1} of ${its.length}: ${it.title}`);
    const p = parseCruisePage(await viaWorker("/cruises/" + it.code, 90000));
    const sail = p.sailings.find(s => Math.abs(s.dep - target) < 86400000);
    if (!sail) continue;
    const seen = new Set();
    const events = p.events.filter(e => { const k = e.ts + e.code + e.ev; if (seen.has(k)) return false; seen.add(k); return true; });
    return { code: it.code, title: it.title, fetched: new Date().toISOString(), days: buildDays(sail, events, target) };
  }
  throw new Error("no " + name + " sailing departs on " + niceDate(dateIso) + ". Double-check the date.");
}

// The lookup order: (1) the trip's saved itinerary (checked by the trip form), (2) NCL live,
// (3) CruiseFeed through the backup helper's /itinerary route, which keeps sold-out and past
// sailings, (4) typing it in by hand.
async function findItinerary(shipKey, dateIso, progress){
  let nclErr;
  try { return Object.assign(await lookupItinerary(shipKey, dateIso, progress), { source: "ncl" }); }
  catch (e) { nclErr = e; }
  if (!data.workerUrl || !data.passphrase)
    throw new Error(nclErr.message + " To find sold-out or past sailings, add the " + (data.workerUrl ? "" : "backup helper address and the ") + "family passphrase in Trip set up.");
  return await lookupViaHelper(shipKey, dateIso, progress);
}
async function lookupViaHelper(shipKey, dateIso, progress){
  const ship = await ensureShip(shipKey);
  const line = catEntry(shipKey)?.lineName || "";
  progress("NCL no longer lists this sailing. Asking the backup helper...");
  const q = new URLSearchParams({ ship: ship.name, date: dateIso });
  if (line) q.set("line", line);
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
  let r, body = null;
  try {
    // encodeURIComponent keeps any passphrase (spaces, accents) safe to send in a header.
    r = await fetch(data.workerUrl.replace(/\/+$/,"") + "/itinerary?" + q, { headers: { "X-DeckFinder-Pass": encodeURIComponent(data.passphrase) }, signal: ctl.signal });
    body = await r.json().catch(() => null);
  } catch (e) {
    if (e.name === "AbortError") throw new Error("the backup helper took too long to answer. Try again.");
    throw new Error("couldn't reach the backup helper. Check your internet connection, the helper address in Trip set up, and that the helper has the Worker code from version 1.9.0.");
  } finally { clearTimeout(timer); }
  const code = body && body.code;
  if (r.status === 401 || code === "bad_pass") throw new Error("the family passphrase wasn't accepted. Check it in Trip set up. It must match the passphrase saved in the backup helper.");
  if (!body || (!r.ok && !code)) throw new Error("the backup helper can't look up itineraries yet. It needs the Worker code from version 1.9.0.");
  if (code === "not_found") throw new Error("neither NCL nor CruiseFeed lists a " + ship.name + " sailing on " + niceDate(dateIso) + ". Double-check the date.");
  if (code === "allowance") throw new Error("the backup helper has used up its CruiseFeed lookups.");
  if (code === "not_configured") throw new Error("the backup helper isn't fully set up yet. It needs its CRUISEFEED_KEY and APP_PASS secrets.");
  if (!r.ok) throw new Error("the backup helper had a problem: " + (body.error || "error " + r.status) + " Try again later.");
  const days = cruiseFeedDays(body);
  if (!days.length) throw new Error("CruiseFeed has this sailing, but not its day-by-day stops.");
  const it = { title: body.title || ship.name + " sailing", fetched: new Date().toISOString(), source: "cruisefeed", days };
  // Where the backup helper found it, like "NCL website, captured 2026-09-23" or "CruiseFeed".
  if (typeof body.source === "string" && body.source.trim()) it.sourceLabel = body.source.trim().slice(0, 80);
  return it;
}
const addDaysIso = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10);
// CruiseFeed times can come as "16:00", "16:00:00", "4:00 PM" or a full date and time. The app stores "HH:MM".
function cfTime(v){
  const m = String(v || "").match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?/);
  if (!m) return "";
  let h = Number(m[1]); const ap = (m[3] || "").toUpperCase();
  if (ap === "P" && h < 12) h += 12;
  if (ap === "A" && h === 12) h = 0;
  return h < 24 ? String(h).padStart(2, "0") + ":" + m[2] : "";
}
// Turn CruiseFeed's list of stops into one entry per calendar day, like the NCL lookup makes.
function cruiseFeedDays(r){
  const start = r.departure_date;
  const stops = (Array.isArray(r.stops) ? r.stops : []).filter(s => s && typeof s === "object").sort((a, b) => (a.seq || 0) - (b.seq || 0));
  if (!start || !stops.some(s => s.port)) return [];
  const nights = r.return_date ? Math.round((Date.parse(r.return_date) - Date.parse(start)) / 86400000) : stops.length - 1;
  if (!(nights >= 0 && nights < 100)) return [];
  const byPosition = stops.length === nights + 1; // undated stops, one per day
  const dated = stops.map((s, i) => ({ s, date: s.date || (s.day_number ? addDaysIso(start, s.day_number - 1) : byPosition ? addDaysIso(start, i) : null) })).filter(x => x.date);
  const days = []; let overnight = null;
  for (let i = 0; i <= nights; i++){
    const iso = addDaysIso(start, i);
    const here = dated.filter(x => x.date === iso && x.s.port && !x.s.is_sea_day).map(x => x.s);
    if (here.length){
      days.push({ date: iso, port: [...new Set(here.map(s => s.port))].join(" and "), arrive: cfTime(here[0].arrive), depart: cfTime(here[here.length - 1].depart) });
      overnight = here[here.length - 1].overnight ? here[here.length - 1].port : null;
    } else if (overnight){ days.push({ date: iso, port: overnight }); overnight = null; }
    else days.push({ date: iso, sea: true });
  }
  return normalizeDays(days);
}

// ---------- itinerary sheet ----------
const SOURCE_TEXT = { ncl: "Found on NCL's website", cruisefeed: "Found through CruiseFeed", manual: "Typed in by hand" };
function itinSource(it){
  const src = SOURCE_TEXT[it.source] ? it.source : "ncl"; // itineraries saved before 1.9.0 all came from NCL
  let s = SOURCE_TEXT[src];
  const label = src === "cruisefeed" && it.sourceLabel && !/^cruisefeed$/i.test(it.sourceLabel) ? it.sourceLabel : "";
  if (label) s = label + (it.fetched ? ", looked up on " + niceDate(it.fetched.slice(0, 10)) : "");
  else if (src !== "manual" && it.fetched) s += " on " + niceDate(it.fetched.slice(0, 10));
  if (it.edited) s += ", then edited by hand";
  if (src === "cruisefeed") s += ". NCL no longer lists this sailing";
  return s + ".";
}
// Arrive and depart times for one day, without hiding any time that was typed in.
function dayTimes(day){
  if (day.sea) return "";
  const a = day.arrive ? "arrive " + niceTime(day.arrive) : "", d = day.depart ? (day.kind === "embark" ? "sails " : "depart ") + niceTime(day.depart) : "";
  const s = [a, d].filter(Boolean).join(", ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const missingTime = d => !d.sea && (d.kind === "embark" ? !d.depart : d.kind === "debark" ? !d.arrive : !(d.arrive && d.depart));

      </div>`).join("") + `<div class="hint">${gaps ? "Some times aren't listed. Tap Edit itinerary to add them from your cruise documents. " : ""}Times are local port time. Check your ship's daily planner for all-aboard times.</div>`

// ---------- find ----------
function runSearch(){
  const q = $("q").value.trim().toLowerCase(); const out = $("results");
  if (!hasPlans(state.ship)) { out.innerHTML = `<div class="hint">Add deck plans for this ship to search it.</div>`; return; }
  if (!q) { out.innerHTML = `<div class="hint">Type a place name, a cabin number, or one of your pins.</div>`; return; }
  const res = []; const ship = SHIPS[state.ship]; const id = state.ship;
  if (/^\d{4,5}$/.test(q)) {
    const d = cabinDeckNum(q);
    const exact = (geoDeck(id, d)?.cabins || []).find(c => c.number === q);
    if (exact) res.push({ label: "Cabin " + q, deck: d, boxes: [exact.box] });
    // A cabin whose deck plan label is this number (a misprint on the plan).
    for (const [dk, gd] of Object.entries(GEO[id]?.decks || {}))
      (gd.cabins || []).filter(c => c.printed_as === q).forEach(c =>
        res.push({ label: `Cabin ${c.number} (printed on the plan as ${q})`, deck: Number(dk), boxes: [c.box] }));
    if (!res.length && d && ship.decks[String(d)]) res.push({ label: "Cabin " + q, deck: d });
  }
  const seen = new Set();
  for (const [d, info] of Object.entries(ship.decks)) {
    const names = [...info.venues];
    (geoDeck(id, d)?.venues || []).forEach(v => { if (!names.some(n => sameVenue(n, v.name))) names.push(v.name); });
    names.forEach(i => {
      const k = d + "|" + normName(i);
      if (!seen.has(k) && i.toLowerCase().includes(q)) { seen.add(k); res.push({ label: i, deck: Number(d), name: i }); }
    });
    // Amenities (pools, hot tubs, sun decks): in search, not in "On this deck".
    // A kind the deck list already names (like "Pool") is found through that name instead.
    const byKind = {};
    (geoDeck(id, d)?.amenities || []).forEach(a => {
      if (a.kind.toLowerCase().includes(q) && !names.some(n => normName(n) === normName(a.kind)))
        (byKind[a.kind] = byKind[a.kind] || []).push(a.box);
    });
    Object.entries(byKind).forEach(([kind, boxes]) => res.push({ label: boxes.length > 1 ? `${kind} (${boxes.length})` : kind, deck: Number(d), boxes }));
  }
  const t = activeTrip();
  if (t && t.ship === id) (t.pins || []).forEach(p => { if (p.ship === id && p.label.toLowerCase().includes(q)) res.push({ label: "📍 " + p.label, deck: p.deck, pin: p.id }); });
  out.innerHTML = res.length
    ? res.map((r, i) => `<button class="res" data-i="${i}"><span>${esc(r.label)}</span><span>Deck ${r.deck}</span></button>`).join("")
    : `<div class="hint">Nothing on ${esc(ship.name)} matches "${esc($("q").value.trim())}".</div>`;
  out.querySelectorAll(".res").forEach(b => b.onclick = () => {
    const r = res[+b.dataset.i]; closeSheets();
    if (r.pin) goToPin(r.pin);
    else if (r.boxes) showBoxes(id, r.deck, r.boxes);
    else if (r.name) highlightVenue(id, r.deck, r.name);
    else { state.deck = r.deck; highlight = null; render(); }
  });
}

// ---------- island maps: places/<id>/ with place.json, basemap.json, places.json, survey-list.json ----------
// Listed under "places" in ships/index.json. Each island saved for offline lives in its own cache,
// "deckfinder-place-<id>", and is re-downloaded only when its hash changes, like ships.
let PLACES = [];            // {id, name, path, port_code, port_name, port_match, bounds, bytes, hash}
const PLACE_DATA = {};      // place id -> { info, base, places, survey, categories } once loaded
const placeLoads = {};
const PLACE_SAVED = {}, placeDownloading = {}, placeDlFailed = {};
const placeEntry = id => PLACES.find(p => p.id === id) || null;
const placeCacheName = id => "deckfinder-place-" + id;
const NOT_SAVED_ISLAND = "This island map isn't saved on your phone yet. Connect to the internet, open the menu, and tap Download for offline next to the island.";

// An itinerary day is an island day when its NCL port code matches, or when its port name contains
// the island's name. Itineraries from CruiseFeed, the shared cache, or typed by hand have no code.
function islandForDay(day){
  if (!day || day.sea) return null;
  const port = normName(day.port || "");
  return PLACES.find(p => (day.code && p.port_code && String(day.code).toUpperCase() === p.port_code.toUpperCase())
    || [p.port_match, p.port_name].some(n => n && port.includes(normName(n)))) || null;
}
function islandDays(trip){ return (trip?.itinerary?.days || []).map(day => ({ day, place: islandForDay(day) })).filter(x => x.place); }

function ensurePlace(id){
  if (PLACE_DATA[id]) return Promise.resolve(PLACE_DATA[id]);
  if (placeLoads[id]) return placeLoads[id];
  const e = placeEntry(id);
  if (!e) return Promise.reject(new Error("that island isn't in the app"));
  const get = f => fetch(e.path + f).then(r => { if (!r.ok) throw new Error(f + " answered " + r.status); return r.json(); });
  placeLoads[id] = (async () => {
    const info = await get("place.json");
    const [base, pl, sv] = await Promise.all([get(info.basemap), get(info.places), get(info.survey_list)]);
    return (PLACE_DATA[id] = { info, base, places: pl.places || [], survey: sv.venues || [], categories: sv.categories || [] });
  })().finally(() => { delete placeLoads[id]; });
  return placeLoads[id];
}
async function refreshSavedPlaces(){
  if (!("caches" in window)) return;
  for (const p of PLACES){
    try {
      const hit = await caches.match(absUrl(p.path + "saved.json"), { cacheName: placeCacheName(p.id) });
      if (hit) PLACE_SAVED[p.id] = (await hit.json()).hash; else delete PLACE_SAVED[p.id];
    } catch (e) {}
  }
}
// Download every file of the island, then store them together. saved.json is written last.
async function savePlace(id){
  if (!("caches" in window) || placeDownloading[id]) return;
  const e = placeEntry(id); if (!e) return;
  placeDownloading[id] = true; delete placeDlFailed[id]; refreshMenu();
  try {
    const bust = "?v=" + e.hash.slice(0, 12); // the ?v= tells sw.js to go to the network
    const get = async f => { const r = await fetch(e.path + f + bust, { cache: "no-store" }); if (!r.ok) throw new Error(f + " answered " + r.status); return r; };
    const infoRes = await get("place.json");
    const info = await infoRes.clone().json();
    const files = await Promise.all([...new Set([info.basemap, info.places, info.survey_list])].map(async f => [f, await get(f)]));
    await caches.delete(placeCacheName(id));
    const c = await caches.open(placeCacheName(id));
    await c.put(absUrl(e.path + "place.json"), infoRes);
    for (const [f, r] of files) await c.put(absUrl(e.path + f), r);
    await c.put(absUrl(e.path + "saved.json"), new Response(JSON.stringify({ hash: e.hash, saved: new Date().toISOString() }), { headers: { "Content-Type": "application/json" } }));
    PLACE_SAVED[id] = e.hash;
    delete PLACE_DATA[id];   // the next open reads the fresh copy (an open map keeps the one it has)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (err) {
    placeDlFailed[id] = true; throw err;
  } finally { delete placeDownloading[id]; refreshMenu(); }
}
// Save the island of every trip that stops there, and refresh a saved island whose files changed.
async function syncOfflinePlaces(){
  if (!catalogReady || !("caches" in window) || !navigator.onLine) return;
  const wanted = new Set(data.trips.flatMap(t => islandDays(t).map(x => x.place.id)));
  for (const p of PLACES){
    const saved = PLACE_SAVED[p.id];
    if ((wanted.has(p.id) && !saved) || (saved && saved !== p.hash)){ try { await savePlace(p.id); } catch (e) {} }
  }
}
function placeBadge(id){
  if (placeDownloading[id]) return `<span class="offl">Downloading...</span>`;
  if (PLACE_SAVED[id]) return `<span class="offl ok">Saved for offline</span>`;
  return `<button class="dl" data-pdl="${esc(id)}">${placeDlFailed[id] ? "Download failed. Tap to retry." : "Download for offline"}</button>`;
}

// ---------- distances and directions ----------
const R_EARTH = 6371008.8, rad = d => d * Math.PI / 180;
function distM(a, b){
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingTo(a, b){
  const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distToBounds(p, b){
  return distM(p, { lat: Math.min(b.max_lat, Math.max(b.min_lat, p.lat)), lon: Math.min(b.max_lon, Math.max(b.min_lon, p.lon)) });
}

function distText(m){

  const mi = ft / 5280;
  return commas(Math.round(ft / 10) * 10) + " feet (" + mi.toFixed(mi < 1 ? 2 : 1) + " miles)";
}
function walkText(m){ const n = Math.max(1, Math.round(m / WALK_M_PER_MIN)); return "About " + n + (n === 1 ? " minute" : " minutes") + " walking"; }
const COMPASS_WORDS = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];

// ---------- GPS: one watch while the island map is open ----------
const gps = { watch: null, fix: null, err: null, listeners: new Set() };
function gpsStart(){
  if (gps.watch !== null) return;
  if (!("geolocation" in navigator)) { gps.err = { code: 0 }; islGpsChanged(); return; }
  if (gps.err && gps.err.code === 1) gps.err = null;
  gps.watch = navigator.geolocation.watchPosition(p => {
    gps.fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    gps.err = null;
    gps.listeners.forEach(f => { try { f(gps.fix); } catch (e) {} });
    islGpsChanged();
  }, e => {
    gps.err = { code: e.code };
    if (e.code === 1) gpsStop();       // permission denied: the watch is over
    islGpsChanged();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function gpsStop(){
  if (gps.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(gps.watch);
  gps.watch = null;
}
const gpsDenied = () => !!(gps.err && (gps.err.code === 1 || gps.err.code === 0));

// ---------- keep the screen awake (Take me back, recording a walk) ----------
const wake = { reasons: new Set(), lock: null, busy: false };
async function wakeSync(){
  if (!("wakeLock" in navigator) || wake.busy) return;
  wake.busy = true;
  try {
    if (wake.reasons.size && !wake.lock && document.visibilityState === "visible"){
      wake.lock = await navigator.wakeLock.request("screen");
      wake.lock.addEventListener("release", () => { wake.lock = null; });
    } else if (!wake.reasons.size && wake.lock){ const l = wake.lock; wake.lock = null; await l.release(); }
  } catch (e) {} finally { wake.busy = false; }
}
function wakeOn(reason){ wake.reasons.add(reason); wakeSync(); }
function wakeOff(reason){ wake.reasons.delete(reason); wakeSync(); }
// The phone drops the lock when the app goes to the background; take it again on return.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wakeSync(); });

// ---------- compass for Take me back ----------
// iPhone: ask for motion permission (inside the tap), then use webkitCompassHeading.
// Android: deviceorientationabsolute. No reading within 3 seconds means no compass: draw a line instead.
const compass = { on: false, heading: null, state: "off", timer: null };
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;
  if (h === null) return;
  const scr = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
  compass.heading = (h + scr + 360) % 360;
  if (compass.state !== "ok"){ compass.state = "ok"; clearTimeout(compass.timer); renderBack(); drawOverlay(); }
  else updateArrow();
}
async function startCompass(){
  if (compass.on) return;
  compass.on = true; compass.heading = null; compass.state = "waiting";
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === "function"){
    try { if (await DOE.requestPermission() !== "granted"){ compass.state = "denied"; renderBack(); drawOverlay(); return; } }
    catch (e) { compass.state = "denied"; renderBack(); drawOverlay(); return; }
  }
  if (!compass.on) return;
  if (!DOE){ compass.state = "none"; renderBack(); drawOverlay(); return; }
  window.addEventListener("deviceorientationabsolute", onOrient);
  window.addEventListener("deviceorientation", onOrient);
  compass.timer = setTimeout(() => { if (compass.on && compass.heading === null){ compass.state = "none"; renderBack(); drawOverlay(); } }, 3000);
}
function stopCompass(){
  compass.on = false; compass.state = "off"; clearTimeout(compass.timer);
  window.removeEventListener("deviceorientationabsolute", onOrient);
  window.removeEventListener("deviceorientation", onOrient);
}
