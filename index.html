<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A3B">
<title>Deck Finder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛳️</text></svg>">
<style>
:root{
  --bg:#EAF1F4; --surface:#FFFFFF; --ink:#0E2A3B; --muted:#5B7382;
  --line:#C6D6DE; --accent:#F26B1D; --accent-ink:#FFFFFF; --chip:#DCE8EE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B24; --surface:#13262F; --ink:#E3EDF2; --muted:#8FA7B4;
    --line:#26414F; --chip:#1B3441;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B24; --surface:#13262F; --ink:#E3EDF2; --muted:#8FA7B4;
  --line:#26414F; --chip:#1B3441;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.35;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 8px 14px}
.decktitle{flex:1;min-width:0}
.decktitle .word{font-size:13px;color:var(--muted);letter-spacing:.02em}
.decktitle .num{font-size:44px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.iconbtn:active{background:var(--chip)}
.iconbtn svg{width:24px;height:24px}

/* body */
.body{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr) 52px;gap:8px;padding:0 6px 0 12px;min-height:0}
.list{overflow-y:auto;min-height:0;padding:2px 2px 16px 0}
.list h2{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 6px}
.list ul{list-style:none;margin:0;padding:0}
.list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li.cabin{color:var(--accent);font-weight:700}
.list .note{font-size:13px;color:var(--muted);margin-top:10px}

.mapwrap{position:relative;min-height:0;background:#fff;border-radius:14px;border:1px solid var(--line);overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y}
.map{position:relative;width:100%;transition:width .2s ease}
.mapwrap.pinching .map{transition:none}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid #0E2A3B;box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(14,42,59,.35);animation:ping 1.6s ease-out 3}
@keyframes ping{0%{box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(14,42,59,.5)}100%{box-shadow:0 0 0 3px #fff,0 0 0 22px rgba(14,42,59,0)}}
.zoom{position:sticky;top:8px;float:right;margin:8px 8px -52px 0;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:22px;font-weight:700;opacity:.9}
.empty{padding:24px 16px;color:#33505F;font-size:15px}
.empty strong{display:block;font-size:18px;margin-bottom:6px;color:#0E2A3B}

/* slider */
.slider{position:relative;min-height:0;touch-action:none;user-select:none}
.track{position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.tick{position:absolute;right:0;left:0;height:0;display:flex;align-items:center;justify-content:flex-start}
.tick span{position:absolute;right:calc(50% + 8px);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.tick.on span{visibility:hidden}
.thumb{position:absolute;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:top .12s ease}
.slider.dragging .thumb{transition:none;transform:scale(1.12)}

/* footer */
.bottom{display:flex;align-items:center;gap:10px;padding:8px 14px 10px}
.shipname{flex:1;font-weight:600}
.cabinchip{background:var(--chip);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
.cabinchip b{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,22,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;z-index:11;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s ease;max-height:80%;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet h3{margin:0 0 10px;font-size:17px}
.shipopt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.shipopt small{color:var(--muted)}
.shipopt.cur{font-weight:700}
.shiprow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.shiprow .shipopt{border-bottom:0;flex:1;min-width:0}
.offl{font-size:12px;color:var(--muted);white-space:nowrap;padding-right:4px}
.offl.ok{color:#2E8B57}
.dl{font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;background:var(--chip);white-space:nowrap}
.shipopt.cur::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.results{overflow-y:auto;margin-top:8px;min-height:0}
.res{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.res span:last-child{color:var(--muted);white-space:nowrap;margin-left:12px}
.hint{color:var(--muted);font-size:13px;padding:10px 4px}

/* trip strip */
.strip{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:9px 12px;border-radius:12px;background:var(--chip);text-align:left;width:calc(100% - 24px)}
.strip .when{font-size:12px;color:var(--muted)}
.strip .what{font-weight:600}
.strip .grow{flex:1;min-width:0}
.strip .chev{color:var(--muted);font-size:18px}
/* menu + forms */
.menuopt{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.sectionlabel{font-size:13px;color:var(--muted);margin:16px 0 2px}
.scroll{overflow-y:auto;min-height:0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;margin-top:10px;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:#C0392B}
.btn:disabled{opacity:.5}
.status{font-size:14px;margin-top:10px;color:var(--muted)}
.status.err{color:#C0392B}
.trip{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.trip .grow{flex:1;min-width:0}
.trip small{color:var(--muted);display:block}
.trip .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.trip.active .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.trip .edit{padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px}
/* itinerary */
.day{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.day .d{width:74px;flex:none;font-size:13px;color:var(--muted)}
.day .p{font-weight:600}
.day .tm{font-size:13px;color:var(--muted)}
.day.today .d{color:var(--accent);font-weight:700}
.day.today .p{color:var(--accent)}
/* pin placement */
.placing .map{cursor:crosshair}
.placebar{position:sticky;top:0;z-index:3;background:var(--ink);color:var(--bg);padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.placebar .grow{flex:1}
.placebar button{background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:600}
/* update banner + version */
.updatebar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;z-index:9;display:block;padding:13px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.updatebar[hidden]{display:none}
.verline{font-size:13px;color:var(--muted);padding:14px 4px 2px}
.news{font-size:15px;padding:6px 4px 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div>
  <header class="top">
    <div class="decktitle"><div class="word">Deck</div><div class="num" id="deckNum">5</div></div>
    <button class="iconbtn" id="findBtn" aria-label="Find a place or cabin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
    </button>
  </header>
  <button class="strip" id="strip"></button>
  </div>

  <main class="body">
    <section class="list" id="list" aria-live="polite"></section>
    <div class="mapwrap" id="mapwrap"></div>
    <div class="slider" id="slider" role="slider" tabindex="0" aria-label="Deck" aria-orientation="vertical"></div>
  </main>

  <footer class="bottom">
    <div class="shipname" id="shipName"></div>
    <button class="cabinchip" id="cabinChip" hidden></button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="menuSheet" role="dialog" aria-label="Menu"><div class="scroll" id="menuBody"></div></div>
<div class="sheet" id="tripSheet" role="dialog" aria-label="Trip set up"><div class="scroll" id="tripBody"></div></div>
<div class="sheet" id="itinSheet" role="dialog" aria-label="Itinerary"><div class="scroll" id="itinBody"></div></div>
<div class="sheet" id="newsSheet" role="dialog" aria-label="What's new"><div class="scroll" id="newsBody"></div></div>
<button class="updatebar" id="updateBar" hidden></button>
<div class="sheet" id="findSheet" role="dialog" aria-label="Find">
  <h3>Find a place or cabin</h3>
  <input class="search" id="q" type="search" placeholder="Try Starbucks, pool, or a cabin number" autocomplete="off">
  <div class="results" id="results"></div>
</div>

<script>
const APP_VERSION = "1.5.0";
const APP_DATE = "2026-09-23";

// ---------- ships: loaded at runtime from ships/index.json and each ship's ship.json ----------
let CATALOG = [];       // every ship in ships/index.json: {id, name, path, decks, bytes, hash, line}
let catalogReady = false;
const SHIPS = {};       // ship id ("ncl/getaway") -> its ship.json, once loaded
const shipLoads = {};   // ship id -> load in progress
const shipErrors = {};  // ship id -> true when it couldn't load (offline and not saved)
const SAVED = {};       // ship id -> hash of the copy saved for offline
const downloading = {}; // ship id -> true while downloading for offline
const dlFailed = {};    // ship id -> true when the last download failed
const LEGACY_SHIPS = { getaway: "ncl/getaway", joy: "ncl/joy", aqua: "ncl/aqua" };
const NOT_SAVED_MSG = "This ship isn't saved on your phone yet. Connect to the internet and tap Download for offline.";
const catEntry = id => CATALOG.find(x => x.id === id) || null;
const shipName = id => SHIPS[id]?.name || catEntry(id)?.name || "";
const shipCacheName = id => "deckfinder-ship-" + String(id).replace("/", "-");
const absUrl = path => new URL(path, location.href).href;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- saved data (stays on this phone) ----------
let state = { ship: "ncl/getaway", deck: 5, zoom: 1 };
let data = { trips: [], activeTripId: null, workerUrl: "" };
try {
  const s = JSON.parse(localStorage.getItem("deckfinder") || "null");
  if (s && typeof s === "object") state = Object.assign(state, s);
  if (typeof state.zoom !== "number") state.zoom = state.zoomed ? 2.2 : 1;
  delete state.zoomed;
  const d = JSON.parse(localStorage.getItem("deckfinder-trips") || "null");
  if (d && Array.isArray(d.trips)) data = Object.assign(data, d);
} catch (e) {}
function save(){
  try {
    localStorage.setItem("deckfinder", JSON.stringify(state));
    localStorage.setItem("deckfinder-trips", JSON.stringify(data));
  } catch (e) {}
}
// Migration (1.5.0): ship keys became "line/ship", like "ncl/getaway". Safe to run any number of times.
function migrateShipIds(){
  let changed = false;
  const fix = v => { if (LEGACY_SHIPS[v]) { changed = true; return LEGACY_SHIPS[v]; } return v; };
  state.ship = fix(state.ship);
  data.trips.forEach(t => { t.ship = fix(t.ship); });
  if (changed) save();
}
migrateShipIds();
let placing = null; // trip id while placing a cabin pin

function activeTrip(){ return data.trips.find(t => t.id === data.activeTripId) || null; }
function deckList(shipKey){ const sh = SHIPS[shipKey]; return sh ? Object.keys(sh.decks).map(Number).sort((a,b)=>a-b) : []; }
function hasPlans(shipKey){ return deckList(shipKey).length > 0; }
// Works before a ship is loaded, using the deck count from ships/index.json.
function shipHasDecks(shipKey){ return SHIPS[shipKey] ? hasPlans(shipKey) : (catEntry(shipKey)?.decks || 0) > 0; }

// ---------- loading ships and saving them for offline ----------
async function loadCatalog(){
  const r = await fetch("ships/index.json");
  if (!r.ok) throw new Error("ships/index.json answered " + r.status);
  const idx = await r.json();
  CATALOG = idx.lines.flatMap(l => l.ships.map(x => Object.assign({ line: l.id }, x)));
  catalogReady = true;
}
function ensureShip(id){
  if (SHIPS[id]) return Promise.resolve(SHIPS[id]);
  if (shipLoads[id]) return shipLoads[id];
  const entry = catEntry(id);
  if (!entry) return Promise.reject(new Error("that ship isn't in the app"));
  delete shipErrors[id];
  shipLoads[id] = fetch(entry.path + "ship.json")
    .then(r => { if (!r.ok) throw new Error("ship.json answered " + r.status); return r.json(); })
    .then(sh => { SHIPS[id] = sh; return sh; })
    .catch(e => { shipErrors[id] = true; throw e; })
    .finally(() => { delete shipLoads[id]; });
  return shipLoads[id];
}
async function refreshSaved(){
  if (!("caches" in window)) return;
  for (const x of CATALOG){
    try {
      const hit = await caches.match(absUrl(x.path + "saved.json"), { cacheName: shipCacheName(x.id) });
      if (hit) SAVED[x.id] = (await hit.json()).hash; else delete SAVED[x.id];
    } catch (e) {}
  }
}
// Download ship.json and every deck image, then store them together as one unit.
// saved.json is written last, so a download cut off halfway never counts as saved.
async function saveShip(id){
  if (!("caches" in window) || downloading[id]) return;
  const entry = catEntry(id); if (!entry) return;
  downloading[id] = true; delete dlFailed[id]; refreshMenu();
  try {
    const bust = "?v=" + entry.hash.slice(0, 12); // the ?v= tells sw.js to go to the network
    const get = async f => { const r = await fetch(entry.path + f + bust, { cache: "no-store" }); if (!r.ok) throw new Error(f + " answered " + r.status); return r; };
    const shipRes = await get("ship.json");
    const sh = await shipRes.clone().json();
    const files = [...new Set(Object.values(sh.decks).map(d => d.image))];
    const imgs = await Promise.all(files.map(async f => [f, await get(f)]));
    await caches.delete(shipCacheName(id));
    const c = await caches.open(shipCacheName(id));
    await c.put(absUrl(entry.path + "ship.json"), shipRes);
    for (const [f, r] of imgs) await c.put(absUrl(entry.path + f), r);
    await c.put(absUrl(entry.path + "saved.json"), new Response(JSON.stringify({ hash: entry.hash, saved: new Date().toISOString() }), { headers: { "Content-Type": "application/json" } }));
    SAVED[id] = entry.hash; SHIPS[id] = sh; delete shipErrors[id];
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    dlFailed[id] = true; throw e;
  } finally { delete downloading[id]; refreshMenu(); }
}
// Save the ship of every trip, and refresh any saved ship whose files changed on the website.
async function syncOfflineShips(){
  if (!catalogReady || !("caches" in window) || !navigator.onLine) return;
  const tripShips = new Set(data.trips.map(t => t.ship));
  for (const x of CATALOG){
    const saved = SAVED[x.id];
    if ((tripShips.has(x.id) && !saved) || (saved && saved !== x.hash)){
      try { await saveShip(x.id); if (x.id === state.ship) render(); } catch (e) {}
    }
  }
}
function imgFailed(){
  $("mapwrap").innerHTML = `<div class="empty"><strong>${SAVED[state.ship] ? "Deck plan didn't load" : "Not saved yet"}</strong>${SAVED[state.ship] ? "Close the app and open it again." : NOT_SAVED_MSG}</div>`;
}
function cabinDeckNum(cabin){
  const c = String(cabin || "").trim();
  if (/^\d{5}$/.test(c)) return parseInt(c.slice(0,2),10);
  if (/^\d{4}$/.test(c)) return parseInt(c.slice(0,1),10);
  return null;
}

// ---------- dates ----------
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function niceDate(iso){ const [y,m,d] = iso.split("-").map(Number); const dt = new Date(Date.UTC(y,m-1,d)); return DOW[dt.getUTCDay()]+", "+MON[m-1]+" "+d; }
function niceTime(hhmm){ if (!hhmm) return ""; let [h,m] = hhmm.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function dayLine(day){
  if (day.sea) return "At sea";
  const bits = [];
  if (day.kind === "embark") return day.port+", sails "+niceTime(day.depart);
  if (day.kind === "debark") return day.port+", arrive "+niceTime(day.arrive);
  if (day.arrive && day.depart) return day.port+", "+niceTime(day.arrive)+" to "+niceTime(day.depart);
  return day.port;
}

// ---------- main render ----------
function render(){
  const trip = activeTrip();
  $("shipName").textContent = shipName(state.ship);
  renderStrip();

  const chip = $("cabinChip");
  if (trip && trip.ship === state.ship && trip.cabin){ chip.hidden = false; chip.innerHTML = `Cabin <b>${esc(trip.cabin)}</b>`; }
  else chip.hidden = true;

  const ship = SHIPS[state.ship];
  if (!ship){
    $("deckNum").textContent = "–"; $("list").innerHTML = ""; $("slider").innerHTML = "";
    $("mapwrap").dataset.key = "";
    $("mapwrap").innerHTML = catalogReady && shipErrors[state.ship]
      ? `<div class="empty"><strong>Not saved yet</strong>${NOT_SAVED_MSG}</div>`
      : `<div class="empty">Loading deck plans...</div>`;
    if (catalogReady && !shipErrors[state.ship]) ensureShip(state.ship).then(render, render);
    save(); return;
  }
  const decks = deckList(state.ship);

  if (!decks.length){
    $("deckNum").textContent = "–";
    $("list").innerHTML = trip && trip.ship === state.ship ? `<h2>Your cabin</h2><ul><li class="cabin">${esc(trip.cabin)} on deck ${cabinDeckNum(trip.cabin) ?? "?"}</li></ul>` : "";
    $("mapwrap").innerHTML = `<div class="empty"><strong>No deck plans yet</strong>Deck plans for ${ship.name} haven't been added to the app. Your trip and itinerary still work.</div>`;
    $("slider").innerHTML = "";
    save(); return;
  }
  if (!decks.includes(state.deck)) state.deck = decks[0];
  const d = state.deck;
  $("deckNum").textContent = d;

  const mineHere = trip && trip.ship === state.ship && cabinDeckNum(trip.cabin) === d;
  const items = ship.decks[d].venues;
  $("list").innerHTML = `<h2>On this deck</h2><ul>${mineHere ? `<li class="cabin">Your cabin ${esc(trip.cabin)}</li>` : ""}${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;

  const key = state.ship + ":" + d;
  const src = catEntry(state.ship).path + ship.decks[d].image;
  const wrap = $("mapwrap");
  const prevScroll = wrap.dataset.key === key ? wrap.scrollTop : null;
  wrap.dataset.key = key;
  const pin = mineHere && trip.pin ? `<div class="pin" id="pin" style="left:${trip.pin.x}%;top:${trip.pin.y}%"></div>` : "";

function renderSlider(){

function deckFromY(clientY){
  const decks = deckList(state.ship); const r = $("slider").getBoundingClientRect();
  const t = Math.min(1, Math.max(0, (clientY - r.top - 14) / (r.height - 28)));

(function(){

// ---------- pinch to zoom the deck plan (two fingers, or ctrl + trackpad pinch) ----------
(function(){
  const wrap = $("mapwrap");
  const MIN = 1, MAX = 5;
  let g = null;
  const clamp = z => Math.min(MAX, Math.max(MIN, z));
  // Zoom to z, keeping the plan point under screen point (px, py) fixed.
  function zoomAt(z, px, py, from){
    const map = $("map"); if (!map) return;
    const r = wrap.getBoundingClientRect();
    const cx = (from.left + px - r.left - map.offsetLeft) / from.zoom;
    const cy = (from.top + py - r.top - map.offsetTop) / from.zoom;
    state.zoom = clamp(z);
    map.style.width = state.zoom * 100 + "%";
    wrap.scrollLeft = cx * state.zoom + map.offsetLeft - (px - r.left);
    wrap.scrollTop = cy * state.zoom + map.offsetTop - (py - r.top);
  }
  function syncBtn(){
    const b = $("zoomBtn"); if (!b) return;
    b.textContent = state.zoom > 1 ? "−" : "+";
    b.setAttribute("aria-label", state.zoom > 1 ? "Zoom out" : "Zoom in");
  }
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const mid = t => [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
  wrap.addEventListener("touchstart", e => {
    if (e.touches.length !== 2 || !$("map")) return;
    const [mx, my] = mid(e.touches);
    g = { d: dist(e.touches), mx, my, zoom: state.zoom, left: wrap.scrollLeft, top: wrap.scrollTop };
    wrap.classList.add("pinching");
  }, { passive: true });
  wrap.addEventListener("touchmove", e => {
    if (!g || e.touches.length !== 2) return;
    e.preventDefault();
    const [mx, my] = mid(e.touches);
    // Anchor on the starting midpoint, then follow the fingers as they move.
    zoomAt(g.zoom * dist(e.touches) / g.d, g.mx, g.my, g);
    wrap.scrollLeft -= mx - g.mx; wrap.scrollTop -= my - g.my;
  }, { passive: false });
  const end = e => {
    if (!g || e.touches.length >= 2) return;
    g = null; wrap.classList.remove("pinching");
    if (state.zoom < 1.05) { state.zoom = 1; const m = $("map"); if (m) m.style.width = "100%"; }
    syncBtn(); save();
  };
  wrap.addEventListener("touchend", end); wrap.addEventListener("touchcancel", end);
  wrap.addEventListener("wheel", e => {
    if (!e.ctrlKey || !$("map")) return;
    e.preventDefault();
    wrap.classList.add("pinching");
    zoomAt(state.zoom * Math.exp(-e.deltaY / 100), e.clientX, e.clientY, { zoom: state.zoom, left: wrap.scrollLeft, top: wrap.scrollTop });
    wrap.classList.remove("pinching");
    syncBtn(); clearTimeout(wrap._zt); wrap._zt = setTimeout(save, 300);
  }, { passive: false });
})();

// ---------- itinerary lookup (through the Cloudflare Worker) ----------
async function getText(url, timeoutMs){
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), timeoutMs || 60000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) { const e = new Error("NCL answered " + r.status); e.status = r.status; throw e; }
    return await r.text();
  } catch (e) {
    if (e.name === "AbortError") throw new Error("the lookup timed out. Try again on a faster connection.");
    throw e;
  } finally { clearTimeout(timer); }
}
// Ask NCL directly first. If that fails and a backup helper (Cloudflare Worker) is saved, try through it.
async function viaWorker(path, timeoutMs){
  try { return await getText("https://www.ncl.com" + path, timeoutMs); }
  catch (direct) {
    if (!data.workerUrl) {
      if (direct instanceof TypeError) throw new Error("couldn't reach NCL. Check your internet connection.");
      throw direct;
    }
    try { return await getText(data.workerUrl.replace(/\/+$/,"") + "/?path=" + encodeURIComponent(path), timeoutMs); }
    catch (e) {
      if (e instanceof TypeError) throw new Error("couldn't reach NCL or the backup helper. Check your internet connection.");
      throw e;
    }
  }
}
function parseCruisePage(raw){
  const t = raw.replaceAll("&quot;", '"').replaceAll("&amp;", "&").replaceAll("&#39;", "'");
  const sailings = [...t.matchAll(/"packageId":(\d+),"sailId":(\d+),"departureDate":(\d+),"returnDate":(\d+)/g)]
    .map(m => ({ dep: +m[3], ret: +m[4] }));
  const events = [...t.matchAll(/"date":(\d+),"portCode":"([^"]*)","portName":"([^"]*)"(?:,"portTag":"[^"]*")?,"event":"([A-Z])"/g)]
    .map(m => ({ ts: +m[1], code: m[2], name: m[3], ev: m[4] }));
  return { sailings, events };
}
function buildDays(sail, events, target){
  // NCL stores port times as local clock time written in UTC, so read them back in UTC.
  const nights = Math.round((sail.ret - sail.dep) / 86400000);
  const days = [];
  for (let i = 0; i <= nights; i++){
    const dayStart = target + i * 86400000, dayEnd = dayStart + 86400000;
    const evs = events.filter(e => e.ts >= dayStart && e.ts < dayEnd);
    const iso = new Date(dayStart).toISOString().slice(0,10);
    const hhmm = ts => new Date(ts).toISOString().slice(11,16);
    const a = evs.find(e => e.ev === "A" && e.code), d = evs.find(e => e.ev === "D" && e.code);
    const port = (a || d)?.name;
    if (i === 0) days.push({ date: iso, kind: "embark", port: d?.name || port || "Embark", depart: d ? hhmm(d.ts) : "" });
    else if (i === nights) days.push({ date: iso, kind: "debark", port: a?.name || port || "Debark", arrive: a ? hhmm(a.ts) : "" });
    else if (!port) days.push({ date: iso, sea: true });
    else days.push({ date: iso, kind: "port", port, arrive: a ? hhmm(a.ts) : "", depart: d ? hhmm(d.ts) : "" });
  }
  return days;
}
async function lookupItinerary(shipKey, dateIso, progress){
  const ship = await ensureShip(shipKey);
  const code = ship.itinerary_code, name = ship.name;
  const [y, m, d] = dateIso.split("-").map(Number);
  const target = Date.UTC(y, m - 1, d);
  progress("Searching " + name + " sailings in " + MON[m-1] + " " + y + "...");
  let search;
  try { search = JSON.parse(await viaWorker(`/api/v2/vacations/search?limit=50&offset=0&ships=${code}&dates=${MON[m-1]}-${y}`)); }
  catch (e) { if (e instanceof SyntaxError) throw new Error("NCL sent back something unexpected."); throw e; }
  const its = search.itineraries || [];
  if (!its.length) throw new Error("NCL shows no " + name + " sailings in " + MON[m-1] + " " + y + ".");
  for (let i = 0; i < its.length; i++){
    const it = its[i];
    progress(`Checking itinerary ${i+1} of ${its.length}: ${it.title}`);
    const p = parseCruisePage(await viaWorker("/cruises/" + it.code, 90000));
    const sail = p.sailings.find(s => Math.abs(s.dep - target) < 86400000);
    if (!sail) continue;
    const seen = new Set();
    const events = p.events.filter(e => { const k = e.ts + e.code + e.ev; if (seen.has(k)) return false; seen.add(k); return true; });
    return { code: it.code, title: it.title, fetched: new Date().toISOString(), days: buildDays(sail, events, target) };
  }
  throw new Error("no " + name + " sailing departs on " + niceDate(dateIso) + ". Double-check the date.");
}

// offline support: register the service worker (https, or localhost for testing)
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

// ---------- updates: compare the live version.json with this copy ----------
const newer = (a, b) => {
  const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return false;
};
let liveInfo = null;
async function fetchVersion(){
  try {
    const r = await fetch("version.json", { cache: "no-store" });
    if (r.ok) liveInfo = await r.json();
  } catch (e) {}
  return liveInfo;
}
async function checkForUpdate(){
  const info = await fetchVersion();
  const bar = $("updateBar");
  if (info && newer(info.version, APP_VERSION)){
    bar.textContent = `Update available (v${info.version}). Tap to update.`;
    bar.hidden = false;
    // Start downloading the new version now so the tap is quick.
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(()=>{});
  } else bar.hidden = true;
}
async function applyUpdate(){
  $("updateBar").textContent = "Updating...";
  const reload = () => location.reload();
  setTimeout(reload, 8000); // never leave anyone stuck on "Updating..."
  const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
  if (!reg) return reload();
  navigator.serviceWorker.addEventListener("controllerchange", reload);
  try { await reg.update(); } catch (e) {}
  const activate = w => w.postMessage("SKIP_WAITING");
  if (reg.waiting) return activate(reg.waiting);
  const w = reg.installing;
  if (!w) return reload();
  w.addEventListener("statechange", () => { if (w.state === "installed") activate(w); });
}
$("updateBar").onclick = applyUpdate;
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });

// ---------- what's new ----------
async function openNews(){
  const info = (await fetchVersion()) || { version: APP_VERSION, date: APP_DATE, notes: "" };
  const update = newer(info.version, APP_VERSION);
  $("newsBody").innerHTML = `
    <h3>What's new</h3>
    <div class="hint" style="padding-top:0">Version ${esc(info.version)} (${esc(info.date)})</div>
    <div class="news">${esc(info.notes || "No notes for this version.")}</div>
    ${update ? `<button class="btn" id="nUpdate">Update to v${esc(info.version)}</button>` : `<div class="hint">You have the latest version.</div>`}`;
  if (update) $("nUpdate").onclick = () => { closeSheets(); applyUpdate(); };
  openSheet("newsSheet");
}
</script>
