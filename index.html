// ---------- island maps: places/<id>/ with place.json, basemap.json, places.json, survey-list.json ----------
// Listed under "places" in ships/index.json. Each island saved for offline lives in its own cache,
// "deckfinder-place-<id>", and is re-downloaded only when its hash changes, like ships.
let PLACES = [];            // {id, name, path, port_code, port_name, port_match, bounds, bytes, hash}
const PLACE_DATA = {};      // place id -> { info, base, places, survey, categories } once loaded
const placeLoads = {};
const PLACE_SAVED = {}, placeDownloading = {}, placeDlFailed = {};
const placeEntry = id => PLACES.find(p => p.id === id) || null;
const placeCacheName = id => "deckfinder-place-" + id;
const NOT_SAVED_ISLAND = "This island map isn't saved on your phone yet. Connect to the internet, open the menu, and tap Download for offline next to the island.";

// An itinerary day is an island day when its NCL port code matches, or when its port name contains
// the island's name. Itineraries from CruiseFeed, the shared cache, or typed by hand have no code.
function islandForDay(day){
  if (!day || day.sea) return null;
  const port = normName(day.port || "");
  return PLACES.find(p => (day.code && p.port_code && String(day.code).toUpperCase() === p.port_code.toUpperCase())
    || [p.port_match, p.port_name].some(n => n && port.includes(normName(n)))) || null;
}
function islandDays(trip){ return (trip?.itinerary?.days || []).map(day => ({ day, place: islandForDay(day) })).filter(x => x.place); }

function ensurePlace(id){
  if (PLACE_DATA[id]) return Promise.resolve(PLACE_DATA[id]);
  if (placeLoads[id]) return placeLoads[id];
  const e = placeEntry(id);
  if (!e) return Promise.reject(new Error("that island isn't in the app"));
  const get = f => fetch(e.path + f).then(r => { if (!r.ok) throw new Error(f + " answered " + r.status); return r.json(); });
  placeLoads[id] = (async () => {
    const info = await get("place.json");
    const [base, pl, sv, ar, tr, sa] = await Promise.all([get(info.basemap), get(info.places), get(info.survey_list),
      info.areas ? get(info.areas).catch(() => null) : null, info.tram_routes ? get(info.tram_routes).catch(() => null) : null,
      info.sign_alignment ? get(info.sign_alignment).catch(() => null) : null]);
    // Since 1.11.1 the files carry display_name (the name without builder notes); the app shows it as name.
    const named = list => (list || []).map(x => Object.assign({}, x, { name: x.display_name || x.name || x.id }));
    const places = named(pl.places), merged = sv.merged || {};
    return (PLACE_DATA[id] = { info, base, places, survey: named(sv.venues), categories: sv.categories || [],
      areas: (ar && Array.isArray(ar.areas) ? ar.areas : []).filter(a => a && a.id && Array.isArray(a.outline) && a.outline.length >= 3),
      merged, removed: sv.removed || [], trams: buildTrams(tr, places, merged), sign: validSignAlignment(sa) });
  })().finally(() => { delete placeLoads[id]; });
  return placeLoads[id];
}
async function refreshSavedPlaces(){
  if (!("caches" in window)) return;
  for (const p of PLACES){
    try {
      const hit = await caches.match(absUrl(p.path + "saved.json"), { cacheName: placeCacheName(p.id) });
      if (hit) PLACE_SAVED[p.id] = (await hit.json()).hash; else delete PLACE_SAVED[p.id];
    } catch (e) {}
  }
}
// Download every file of the island, then store them together. saved.json is written last.
async function savePlace(id){
  if (!("caches" in window) || placeDownloading[id]) return;
  const e = placeEntry(id); if (!e) return;
  placeDownloading[id] = true; delete placeDlFailed[id]; refreshMenu();
  try {
    const bust = "?v=" + e.hash.slice(0, 12); // the ?v= tells sw.js to go to the network
    const get = async f => { const r = await fetch(e.path + f + bust, { cache: "no-store" }); if (!r.ok) throw new Error(f + " answered " + r.status); return r; };
    const infoRes = await get("place.json");
    const info = await infoRes.clone().json();
    const files = await Promise.all([...new Set([info.basemap, info.places, info.survey_list, info.areas, info.tram_routes, info.sign_alignment].filter(Boolean))].map(async f => [f, await get(f)]));
    await caches.delete(placeCacheName(id));
    const c = await caches.open(placeCacheName(id));
    await c.put(absUrl(e.path + "place.json"), infoRes);
    for (const [f, r] of files) await c.put(absUrl(e.path + f), r);
    await c.put(absUrl(e.path + "saved.json"), new Response(JSON.stringify({ hash: e.hash, saved: new Date().toISOString() }), { headers: { "Content-Type": "application/json" } }));
    PLACE_SAVED[id] = e.hash;
    delete PLACE_DATA[id];   // the next open reads the fresh copy (an open map keeps the one it has)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (err) {
    placeDlFailed[id] = true; throw err;
  } finally { delete placeDownloading[id]; refreshMenu(); }
}
// Save the island of every trip that stops there, and refresh a saved island whose files changed.
async function syncOfflinePlaces(){
  if (IS_APP) return;    // built into the Android app
  if (!catalogReady || !("caches" in window) || !navigator.onLine) return;
  const wanted = new Set(data.trips.flatMap(t => islandDays(t).map(x => x.place.id)));
  for (const p of PLACES){
    const saved = PLACE_SAVED[p.id];
    if ((wanted.has(p.id) && !saved) || (saved && saved !== p.hash)){ try { await savePlace(p.id); } catch (e) {} }
  }
}
function placeBadge(id){
  if (IS_APP) return `<span class="offl ok">Built into this app</span>`;
  if (placeDownloading[id]) return `<span class="offl">Downloading...</span>`;
  if (PLACE_SAVED[id]) return `<span class="offl ok">Saved for offline</span>`;
  return `<button class="dl" data-pdl="${esc(id)}">${placeDlFailed[id] ? "Download failed. Tap to retry." : "Download for offline"}</button>`;
}

// ---------- distances and directions ----------
const R_EARTH = 6371008.8, rad = d => d * Math.PI / 180;
function distM(a, b){
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearingTo(a, b){
  const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distToBounds(p, b){
  return distM(p, { lat: Math.min(b.max_lat, Math.max(b.min_lat, p.lat)), lon: Math.min(b.max_lon, Math.max(b.min_lon, p.lon)) });
}

const commas = n => Math.round(n).toLocaleString("en-US");
function distText(m){
  const ft = m * 3.28084;
  if (ft <= 1000) return commas(ft < 50 ? ft : Math.round(ft / 10) * 10) + " feet";
  const mi = ft / 5280;
  return commas(Math.round(ft / 10) * 10) + " feet (" + mi.toFixed(mi < 1 ? 2 : 1) + " miles)";
}
function walkText(m){ const n = Math.max(1, Math.round(m / WALK_M_PER_MIN)); return "About " + n + (n === 1 ? " minute" : " minutes") + " walking"; }

// ---------- GPS: one watch while the island map is open ----------
const gps = { watch: null, fix: null, err: null, listeners: new Set() };
function gpsStart(){
  if (gps.watch !== null) return;
  if (!("geolocation" in navigator)) { gps.err = { code: 0 }; islGpsChanged(); return; }
  if (gps.err && gps.err.code === 1) gps.err = null;
  gps.watch = navigator.geolocation.watchPosition(p => {
    gps.fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    gps.err = null;
    gps.listeners.forEach(f => { try { f(gps.fix); } catch (e) {} });
    islGpsChanged();
  }, e => {
    gps.err = { code: e.code };
    if (e.code === 1) gpsStop();       // permission denied: the watch is over
    islGpsChanged();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function gpsStop(){
  if (gps.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(gps.watch);
  gps.watch = null;
}
const gpsDenied = () => !!(gps.err && (gps.err.code === 1 || gps.err.code === 0));

// ---------- keep the screen awake (Take me back, recording a walk) ----------
const wake = { reasons: new Set(), lock: null, busy: false, app: false };
async function wakeSync(){
  // Android app: the Keep awake plugin, which also holds while the app is hidden and shown again.
  const KA = plugin("KeepAwake");
  if (KA){
    const on = wake.reasons.size > 0;
    if (on !== wake.app){ wake.app = on; try { await (on ? KA.keepAwake() : KA.allowSleep()); } catch (e) {} }
    return;
  }
  if (!("wakeLock" in navigator) || wake.busy) return;
  wake.busy = true;
  try {
    if (wake.reasons.size && !wake.lock && document.visibilityState === "visible"){
      wake.lock = await navigator.wakeLock.request("screen");
      wake.lock.addEventListener("release", () => { wake.lock = null; });
    } else if (!wake.reasons.size && wake.lock){ const l = wake.lock; wake.lock = null; await l.release(); }
  } catch (e) {} finally { wake.busy = false; }
}
function wakeOn(reason){ wake.reasons.add(reason); wakeSync(); }
function wakeOff(reason){ wake.reasons.delete(reason); wakeSync(); }
// The phone drops the lock when the app goes to the background; take it again on return.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wakeSync(); });

// ---------- compass for Take me back ----------
// iPhone: ask for motion permission (inside the tap), then use webkitCompassHeading.
// Android: deviceorientationabsolute. No reading within 3 seconds means no compass: draw a line instead.
const compass = { on: false, heading: null, state: "off", timer: null };
function onOrient(e){
  let h = null;
  if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;
  if (h === null) return;
  const scr = screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : (window.orientation || 0);
  compass.heading = (h + scr + 360) % 360;
  if (compass.state !== "ok"){ compass.state = "ok"; clearTimeout(compass.timer); renderBack(); drawOverlay(); }
  else updateArrow();
}
async function startCompass(){
  if (compass.on) return;
  compass.on = true; compass.heading = null; compass.state = "waiting";
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === "function"){
    try { if (await DOE.requestPermission() !== "granted"){ compass.state = "denied"; renderBack(); drawOverlay(); return; } }
    catch (e) { compass.state = "denied"; renderBack(); drawOverlay(); return; }
  }
  if (!compass.on) return;
  if (!DOE){ compass.state = "none"; renderBack(); drawOverlay(); return; }
  window.addEventListener("deviceorientationabsolute", onOrient);
  window.addEventListener("deviceorientation", onOrient);
  compass.timer = setTimeout(() => { if (compass.on && compass.heading === null){ compass.state = "none"; renderBack(); drawOverlay(); } }, 3000);
}
function stopCompass(){
  compass.on = false; compass.state = "off"; clearTimeout(compass.timer);
  window.removeEventListener("deviceorientationabsolute", onOrient);
  window.removeEventListener("deviceorientation", onOrient);
}

function proj(lat, lon){ return [(lon - isl.lon0) * isl.kx, (isl.lat0 - lat) * isl.ky]; }
function toScreen(lat, lon){ const [x, y] = proj(lat, lon); return [x * isl.s + isl.tx, y * isl.s + isl.ty]; }
const ptsD = cs => cs.map((c, i) => { const [x, y] = proj(c[1], c[0]); return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }).join("");
function islSetup(d){
  const b = d.info.bounds;
  Object.assign(isl, { d, lat0: (b.min_lat + b.max_lat) / 2, lon0: (b.min_lon + b.max_lon) / 2 });
  isl.kx = 111320 * Math.cos(rad(isl.lat0)); isl.ky = 110574;
  const cls = { land: "g-land", beach: "g-beach", water: "g-water", pool: "g-water", building: "g-bldg", pier: "g-pier", road: "g-road", path: "g-path" };
  $("igeo").innerHTML = (d.base.features || []).map(f => {
    const k = f.properties?.kind, g = f.geometry; if (!cls[k] || !g) return "";
    if (g.type === "Polygon") return `<path class="${cls[k]}" d="${g.coordinates.map(r => ptsD(r) + "Z").join("")}"/>`;
    if (g.type === "LineString") return `<path class="${k === "pier" ? "g-pierl" : cls[k]}" d="${ptsD(g.coordinates)}"/>`;
    return "";
  }).join("");
  // The areas on the island sign: a soft tint of each sign color, under the places.
  d.areas.forEach(a => { if (!a.label) a.label = areaLabelPoint(a.outline); });
  // Since 1.15.0 the tints are clipped to land and beach, so no area is painted over the water.
  const dry = (d.base.features || []).filter(f => ["land", "beach"].includes(f.properties?.kind) && f.geometry?.type === "Polygon");
  $("iclip").innerHTML = dry.map(f => `<path clip-rule="evenodd" d="${f.geometry.coordinates.map(r => ptsD(r) + "Z").join("")}"/>`).join("");
  $("iarea").innerHTML = `<g${dry.length ? ` clip-path="url(#iclip)"` : ""}>` + d.areas.map(a => `<path class="a-fill" data-area="${esc(a.id)}" fill="${esc(a.color)}" stroke="${esc(a.color)}" d="${ptsD(a.outline.map(c => [c[1], c[0]])) + "Z"}"/>`).join("") + `</g>`;
  // Dry ground (land, beach and pier shapes, each a list of rings of [lat, lon]), for "Open island"
  // away from every area. Since 1.15.0 land can have holes (water cut out of it).
  if (!d.ground) d.ground = (d.base.features || []).filter(f => ["land", "beach", "pier"].includes(f.properties?.kind) && f.geometry?.type === "Polygon")
    .map(f => f.geometry.coordinates.map(r => r.map(c => [c[1], c[0]])));
  renderTrams();
  adoptMerged(isl.id, d);
  renderAreaRow(); renderIslCats();
  $("iMsg").hidden = true;
  applyMapView();
  fitIsland();
  renderIslMarks();
  islGpsChanged();
  if (isl.pendingSel){ const k = isl.pendingSel; isl.pendingSel = null; isl.moved = true; selectMark(k, true); }
}
function mapSize(){ const r = $("imap").getBoundingClientRect(); return { w: r.width || 360, h: r.height || 500 }; }
function fitBox(lat1, lon1, lat2, lon2, pad){
  const { w, h } = mapSize();
  const [x1, y1] = proj(Math.max(lat1, lat2), Math.min(lon1, lon2)), [x2, y2] = proj(Math.min(lat1, lat2), Math.max(lon1, lon2));
  const s = Math.min((w - 2 * pad) / Math.max(1, x2 - x1), (h - 2 * pad) / Math.max(1, y2 - y1));
  isl.s = Math.min(8, s); isl.tx = w / 2 - (x1 + x2) / 2 * isl.s; isl.ty = h / 2 - (y1 + y2) / 2 * isl.s;
  applyView();
}
function fitIsland(){
  const b = isl.d.base.island_bounds || isl.d.info.bounds;
  fitBox(b.min_lat, b.min_lon, b.max_lat, b.max_lon, 16);
  isl.fitS = isl.s;
}
function centerOn(lat, lon, minS){
  const { w, h } = mapSize();
  if (minS && isl.s < minS) isl.s = minS;
  const [x, y] = proj(lat, lon);
  isl.tx = w / 2 - x * isl.s; isl.ty = h / 2 - y * isl.s;
  applyView();
}
const clampS = s => Math.min(25, Math.max((isl.fitS || 0.1) * 0.6, s));
function zoomAt(f, px, py){
  const s = clampS(isl.s * f);
  isl.tx = px - (px - isl.tx) * s / isl.s; isl.ty = py - (py - isl.ty) * s / isl.s; isl.s = s;
  applyView();
}
function applyView(){
  if (!isl || !isl.d) return;
  const m = `matrix(${isl.s} 0 0 ${isl.s} ${isl.tx} ${isl.ty})`;
  ["igeo", "isign", "iarea", "itram", "iover"].forEach(g => $(g).setAttribute("transform", m));
  $("imap").classList.toggle("labels", isl.s >= LABEL_S);
  // Area names grow with the zoom, from small on the whole island to large, and hide when tiny.
  $("imarks").style.setProperty("--afs", Math.min(22, Math.max(10, isl.s * 45)).toFixed(1) + "px");
  $("imap").classList.toggle("nolabels", isl.s < 0.06);
  const els = [...$("imarks").querySelectorAll("[data-lat]")];
  const pos = els.map(el => toScreen(+el.dataset.lat, +el.dataset.lon));
  const off = fanOut(els, pos);
  const groups = isl.s < ISLAND_OPEN_S ? clusterMarks(els, pos) : [];
  const grouped = new Set(groups.flatMap(g => g.members));
  const at = pos.map((p, i) => off[i] ? [p[0] + off[i].dx, p[1] + off[i].dy] : p);
  els.forEach((el, i) => {
    el.style.transform = `translate(${at[i][0].toFixed(1)}px,${at[i][1].toFixed(1)}px)`;
    el.classList.toggle("inclu", grouped.has(i));
  });
  const bubbles = renderBubbles(groups);
  placeLabels(els, at, off, grouped, bubbles);
  renderTiles();
}
// ---------- labels that don't pile up (1.15.0) ----------
// Each label that shows goes below its marker when that spot is free. When it would cover another
// label, a marker or a bubble, it tries above, then right, left and the four corners, and takes the
// first free spot, then one row farther above and below. A label with no free spot anywhere hides
// (its marker stays, and tapping it shows the name), except the selected place and your saved spots.
// Labels placed first keep their spot: the selected place, your saved spots, lit-up places, tram
// stops, restrooms and first aid, then the rest in a fixed order, so panning never shuffles them. Fanned-out markers try their
// outer side first.
const LABEL_H = 15, LABEL_GAP = 3;
let labelCtx = null;
function labelWidth(sp){
  if (sp.dataset.lw) return +sp.dataset.lw;
  if (!labelCtx) labelCtx = document.createElement("canvas").getContext("2d");
  labelCtx.font = "700 11px " + getComputedStyle(sp).fontFamily;
  const w = Math.min(190, Math.ceil(labelCtx.measureText(sp.textContent).width) + 10);
  sp.dataset.lw = w;
  return w;
}
function placeLabels(els, pts, off, grouped, bubbles){
  const on = $("imap").classList.contains("labels"), items = [];
  els.forEach((el, i) => {
    const mk = el.classList.contains("mk");
    if (grouped.has(i) || (!mk && !el.classList.contains("svmk"))) return;
    const sp = el.querySelector(":scope > span"); if (!sp) return;
    const spot = el.classList.contains("spotmk");
    items.push({ el, sp, i, x: pts[i][0], y: pts[i][1], half: spot ? 17 : mk ? 15 : 7, border: mk ? 3 : 2,
      shown: on || el.classList.contains("sel") || spot });
  });
  // Other markers count by their inner part, so a label may touch a neighbor's white rim but not its icon.
  const marks = items.map(t => { const q = t.half * 0.6; return { l: t.x - q, r: t.x + q, t: t.y - q, b: t.y + q, el: t.el }; });

// ---------- panning and pinch zoom (one finger pans, two fingers zoom, mouse wheel zooms) ----------
(function(){
  const el = $("imap"); const pts = new Map(); let g = null, lastTap = null;
  const skip = t => t.closest(".ibottom,.itools,.itopstack,.imsg");
  const snap = () => { const a = [...pts.values()]; if (a.length >= 2) return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 }; return { d: 0, x: a[0].x, y: a[0].y }; };
  const restart = () => { g = Object.assign(snap(), { s: isl.s, tx: isl.tx, ty: isl.ty }); };
  el.addEventListener("pointerdown", e => {
    if (!isl || !isl.d || skip(e.target)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    restart(); g.dragged = pts.size > 1;
    if (pts.size > 1) try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener("pointermove", e => {
    if (!g || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = snap();
    if (!g.dragged){
      if (Math.hypot(now.x - g.x, now.y - g.y) < 6) return;
      g.dragged = true; try { el.setPointerCapture(e.pointerId); } catch (_) {}
    }
    const r = el.getBoundingClientRect();
    const s = pts.size >= 2 && g.d > 0 ? clampS(g.s * now.d / g.d) : g.s;
    const mx = (g.x - r.left - g.tx) / g.s, my = (g.y - r.top - g.ty) / g.s;   // map point under the start
    isl.s = s; isl.tx = now.x - r.left - mx * s; isl.ty = now.y - r.top - my * s;
    isl.moved = true; applyView();
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    const dragged = g && g.dragged;
    if (pts.size){ restart(); g.dragged = true; return; }   // one finger lifted: keep panning with the other
    g = null;
    if (dragged){ el.dataset.dragged = "1"; setTimeout(() => { delete el.dataset.dragged; }, 50); }
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("click", e => {
    if (!isl || !isl.d || skip(e.target) || el.dataset.dragged) return;
    const now = Date.now(), r = el.getBoundingClientRect();
    if (lastTap && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30){
      lastTap = null; isl.moved = true; zoomAt(2, e.clientX - r.left, e.clientY - r.top); return;   // double tap: zoom in
    }
    lastTap = { t: now, x: e.clientX, y: e.clientY };
    if (isl.sel){ isl.sel = null; isl.hot = null; renderIslMarks(); }
  });
  el.addEventListener("wheel", e => {
    if (!isl || !isl.d) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    isl.moved = true; zoomAt(Math.exp(-e.deltaY / 300), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  const zoomBtn = f => () => { if (!isl || !isl.d) return; const { w, h } = mapSize(); isl.moved = true; zoomAt(f, w / 2, h / 2); };
  $("iZoomIn").onclick = zoomBtn(2); $("iZoomOut").onclick = zoomBtn(0.5);
  $("iLocate").onclick = () => {
    if (!isl || !isl.d) return;
    if (gps.fix && onIsland()) centerOn(gps.fix.lat, gps.fix.lon, 2);
    else { fitIsland(); if (gpsDenied()) openLocationHelp(); }
  };
})();

// Is [lat, lon] inside an outline of [lat, lon] corners? (ray casting; fine at this size)
function inOutline(lat, lon, o){
  let inside = false;
  for (let i = 0, j = o.length - 1; i < o.length; j = i++){
    const [yi, xi] = o[i], [yj, xj] = o[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Inside a shape with holes: inside an odd number of its rings.
const inRings = (lat, lon, rings) => rings.filter(r => inOutline(lat, lon, r)).length % 2 === 1;
// Meters from a point to an outline's edge.
function metersToOutline(lat, lon, o){
  const kx = 111320 * Math.cos(rad(lat)), ky = 110574;
  let best = Infinity;
  for (let i = 0, j = o.length - 1; i < o.length; j = i++){
    const ax = (o[j][1] - lon) * kx, ay = (o[j][0] - lat) * ky, bx = (o[i][1] - lon) * kx, by = (o[i][0] - lat) * ky;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
// Where an area's name goes: the point inside it farthest from its edges (tried on a grid).
function areaLabelPoint(o){
  const lats = o.map(c => c[0]), lons = o.map(c => c[1]);
  const [a, b, c, d] = [Math.min(...lats), Math.max(...lats), Math.min(...lons), Math.max(...lons)];
  let best = { lat: (a + b) / 2, lon: (c + d) / 2 }, bestD = -1;
  for (let i = 1; i < 24; i++) for (let j = 1; j < 24; j++){
    const lat = a + (b - a) * i / 24, lon = c + (d - c) * j / 24;
    if (!inOutline(lat, lon, o)) continue;
    const m = metersToOutline(lat, lon, o);
    if (m > bestD){ bestD = m; best = { lat, lon }; }
  }

}
const NEAR_AREA_M = 400;   // "Near: <area>" only within this distance

// Satellite tiles (Web Mercator) placed on the app's own map. Over an island this small, the map's

const tiles = new Map();   // "z/x/y" -> <img>

function renderTiles(){

// ---------- trams: the island's tram routes (tram-routes.json, since 1.13.0) ----------
// Each route is a line with its stops in order. Trams are taken to run both ways along a route.
// Tram times aren't known, so directions count only the walking (about 3 miles per hour, straight line).
const ROUTE_COLORS = { 1: "#D81B60", 2: "#5E35B1" };
const TRAM_BACK_M = 600;    // Take me back adds tram directions when the spot is farther than this

function buildTrams(rf, places, merged){
  const byId = new Map(places.filter(p => p.category === "tram").map(p => [p.id, p]));
  const pt = c => ({ lat: c[1], lon: c[0] });
  const routes = (rf && Array.isArray(rf.features) ? rf.features : []).map((f, n) => {
    const pr = f.properties || {};
    const coords = ((f.geometry && f.geometry.coordinates) || []).filter(c => Array.isArray(c) && isFinite(c[0]) && isFinite(c[1]));
    const stops = (pr.stops || []).map(s => byId.get(s.id) || byId.get(merged[s.id])).filter(Boolean);
    if (coords.length < 2 || stops.length < 2) return null;
    // Split the line where it passes each stop, so each stretch between two stops can be dashed on its own.
    const cut = [0];
    for (let i = 1; i < stops.length - 1; i++){
      let best = cut[i - 1], bd = Infinity;
      for (let j = cut[i - 1]; j < coords.length; j++){ const d = distM(stops[i], pt(coords[j])); if (d < bd){ bd = d; best = j; } }

      const g = (pr.segments || []).find(x => x.from_stop === stops[i].stop_number && x.to_stop === s.stop_number) || {};

      return { approx: !!g.approximate_path, len: typeof g.length_m === "number" ? g.length_m : len, pts };
    });

    return { num, name: pr.name || "Route " + num, color: ROUTE_COLORS[num] || "#555555", stops, segs };

function tramPlan(from, to){
  const T = isl?.d?.trams; if (!T) return null;
  const stops = [...new Set(T.routes.flatMap(r => r.stops))];
  const nearest = q => stops.reduce((b, s) => distM(q, s) < distM(q, b) ? s : b);
  const a = nearest(from), b = nearest(to), direct = distM(from, to), d1 = distM(from, a), d2 = distM(b, to);
  const legs = a !== b ? rideLegs(a, b) : null;
  return { a, b, direct, d1, d2, w1: d1 < NEAR_STOP_M ? 0 : d1, w2: d2 < NEAR_STOP_M ? 0 : d2, legs, walk: !legs || d1 + d2 >= direct };
}
function tramSteps(plan, toName){
  const s = [plan.w1 ? `Walk ${walkMin(plan.w1)} min to ${stopLabel(plan.a)}.` : `Get on at ${stopLabel(plan.a)}.`];
  plan.legs.forEach((l, i) => {
    if (i) s.push(`Change to the ${l.route.name}.`, `Ride to ${stopLabel(l.to)}.`);
    else s.push(`Ride the ${l.route.name} to ${stopLabel(l.to)}.`);
  });
  if (plan.w2) s.push(`Walk ${walkMin(plan.w2)} min to ${toName}.`);
  return s;
}
function tramTimesNote(plan){
  const w = (plan.w1 ? walkMin(plan.w1) : 0) + (plan.w2 ? walkMin(plan.w2) : 0);
  return (w ? `About ${w} min of walking` : "No walking to or from the stops") + `, instead of about ${walkMin(plan.direct)} min walking the whole way. `
    + "Tram times aren't known, so waiting for the tram and the ride itself aren't counted.";
}
function openTramGuide(){
  const T = isl?.d?.trams; if (!T) return;
  const all = [...new Set(T.routes.flatMap(r => r.stops))], shared = all.filter(s => routesAt(s).length > 1);
  islandSheet(`<h3>🚋 Tram guide</h3>
    <div class="hint" style="padding-top:0">${T.routes.length === 1 ? "One tram route runs" : (["", "", "Two", "Three", "Four"][T.routes.length] || T.routes.length) + " tram routes run"} on the island.${shared.length ? " " + esc(shared.map(stopLabel).join(" and ")) + " is where you change between them." : ""} Tap a stop to see it on the map.</div>
    ${T.routes.map(r => `<div class="sectionlabel"><span class="rsw" style="--rc:${r.color}"></span> ${esc(routeTitle(r))}</div>
      ${r.stops.map(s => `<button class="res" data-k="place:${esc(s.id)}"><span><b class="snum inl">${s.stop_number ?? ""}</b>${esc(stopShort(s))}</span><span>${esc([routesAt(s).length > 1 ? "Change here" : "", s.name_confirmed === false ? "Name to confirm" : ""].filter(Boolean).join(", "))}</span></button>`).join("")}
      <div class="hint">About ${esc(distText(r.segs.reduce((t, s) => t + s.len, 0)))} from end to end.${r.segs.some(s => s.approx) ? " Its line on the map is dashed where the path is approximate." : ""}</div>`).join("")}
    <div class="hint">These routes come from a guide and the island sign, and are still being confirmed. Tram times aren't known. Check the sign at each stop.</div>
    <button class="btn" id="tgMap">Show both routes on the map</button>
    <button class="btn ghost" id="tgClose">Close</button>`);
  $("islandBody").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { closeSheets(); isl.moved = true; selectMark(b.dataset.k, true); });
  $("tgMap").onclick = () => {
    closeSheets();
    const cs = T.routes.flatMap(r => r.segs.flatMap(s => s.pts));
    isl.moved = true; isl.areaFilter = null; renderAreaRow();
    fitBox(Math.min(...cs.map(c => c[1])), Math.min(...cs.map(c => c[0])), Math.max(...cs.map(c => c[1])), Math.max(...cs.map(c => c[0])), 60);
    renderIslMarks();
  };
  $("tgClose").onclick = closeSheets;
}
// The places for "Starting from" (1.15.0): no removed or merged places, no true duplicates (the same id,
// or the same name within 30 m), and names that several places share carry their sign number or area,
// like "Beaches Bar (Beaches 3)", plus the nearest other place when even that is shared. Grouped by
// area in sign order, sorted by name in each group.
function tramStartGroups(k){
  const d = isl.d, gone = new Set([...(d.removed || []), ...Object.keys(d.merged || {})]), list = [];
  d.places.forEach(p => {
    if ("place:" + p.id === k || gone.has(p.id) || list.some(q => q.id === p.id || (q.name === p.name && distM(q, p) <= 30))) return;
    list.push(p);
  });
  const shared = (f, x) => list.filter(q => f(q) === f(x)).length > 1;
  const first = p => shared(q => q.name, p) ? `${p.name} (${legend(p) || areaOf(p.area_id)?.name || "Open island"})` : p.name;
  const label = p => {
    const l = first(p);
    if (!shared(first, p)) return l;
    const near = list.filter(q => q.name !== p.name).reduce((b, q) => !b || distM(p, q) < distM(p, b) ? q : b, null);
    return near ? l.slice(0, -1) + `, near ${near.name})` : l;
  };
  const items = list.map(p => ({ p, label: label(p) }));
  const order = [...d.areas.map(a => a.id), ""];
  return order.map(id => ({ name: areaOf(id)?.name || "Other places",
    items: items.filter(x => (areaOf(x.p.area_id) ? x.p.area_id : "") === id).sort((a, b) => a.label.localeCompare(b.label)) }))
    .filter(g => g.items.length);
}
// Get there by tram, from where you are (on the island) or from a place you pick.
function openTramTrip(k){
  const to = markInfo(k); if (!to || !isl.d.trams) return;
  const here = gps.fix && onIsland();
  const groups = tramStartGroups(k);
  const spots = islSpots().filter(s => "spot:" + s.id !== k);
  const keys = [...spots.map(s => "spot:" + s.id), ...groups.flatMap(g => g.items.map(x => "place:" + x.p.id))];
  const start = here ? "here" : keys.includes(isl.tramFrom) ? isl.tramFrom : "";
  islandSheet(`<h3>🚋 Get there by tram</h3>
    <div class="hint" style="padding-top:0">To <b>${esc(to.name)}</b></div>
    <label class="field"><span>Starting from</span><select id="ttFrom">
      ${here ? `<option value="here">Where I am now</option>` : `<option value="">Pick where you're starting</option>`}
      ${spots.length ? `<optgroup label="Your saved spots">${spots.map(s => `<option value="spot:${esc(s.id)}">⭐ ${esc(s.name)}</option>`).join("")}</optgroup>` : ""}
      ${groups.map(g => `<optgroup label="${esc(g.name)}">${g.items.map(x => `<option value="place:${esc(x.p.id)}">${esc(x.label)}</option>`).join("")}</optgroup>`).join("")}
    </select></label>
    <div id="ttOut"></div>
    <button class="btn ghost" id="ttClose">Close</button>`);
  $("ttFrom").value = start;
  const show = () => {
    const v = $("ttFrom").value;
    if (v !== "here") isl.tramFrom = v;
    const from = v === "here" ? (gps.fix && onIsland() ? gps.fix : null) : markInfo(v);
    if (!from){ $("ttOut").innerHTML = `<div class="hint">${here ? esc(whyNoFix() || "Waiting for your location...") : "You're not on the island right now, so pick the place you'll start from."}</div>`; return; }
    const plan = tramPlan(from, to);
    const out = plan.walk
      ? `<div class="tquick">Walking is quicker: about ${walkMin(plan.direct)} min</div>
         <div class="hint">${plan.a === plan.b ? `The same tram stop, ${esc(stopLabel(plan.a))}, is the nearest one to both ends.` : `Walking to ${esc(stopLabel(plan.a))} and from ${esc(stopLabel(plan.b))} would take about ${walkMin(plan.d1) + walkMin(plan.d2)} min on its own.`}</div>`
      : `<ol class="tsteps">${tramSteps(plan, to.name).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
         <div class="hint">${esc(tramTimesNote(plan))}</div>`;
    $("ttOut").innerHTML = out + `<div class="hint">Walking minutes are for about 3 miles per hour in a straight line, so allow a little more.</div>
      <button class="btn" id="ttMap">Show on the map</button>`;
    $("ttMap").onclick = () => {
      closeSheets(); isl.moved = true;
      fitBox(from.lat, from.lon, to.lat, to.lon, 90);
      selectMark(k);
    };
  };
  $("ttFrom").onchange = show; show();
  $("ttClose").onclick = closeSheets;
}

function islandSheet(html){ $("islandBody").innerHTML = html; openSheet("islandSheet"); $("islandBody").scrollTop = 0; }
$("iFind").onclick = () => {
  if (!isl || !isl.d) return;
  islandSheet(`<h3>Find on ${esc(placeEntry(isl.id).name)}</h3>
    <input class="search" id="iq" type="search" placeholder="Try beach, bar, tram, or your spot" autocomplete="off">
    <div class="results" id="iresults"></div>`);
  $("iq").addEventListener("input", runIslandSearch); runIslandSearch();
  setTimeout(() => $("iq")?.focus(), 150);
};
function runIslandSearch(){
  const q = normName($("iq").value), S = sv(isl.id), d = isl.d;
  const areaName = id => areaOf(id)?.name || "";
  const items = [
    ...islSpots().map(s => ({ k: "spot:" + s.id, label: "⭐ " + s.name, sub: "Your spot", group: "spots" })),
    ...d.places.map(p => ({ k: "place:" + p.id, label: placeLabel(p), sub: [cat(p.category).label, legend(p)].filter(Boolean).join(", "), cat: p.category, group: p.area_id, area: areaName(p.area_id) })),
    ...d.survey.filter(v => typeof S.venues[v.id]?.lat === "number").map(v => ({ k: "tag:" + v.id, label: S.venues[v.id].rename || v.name, sub: "Survey", cat: v.category, group: v.area_id, area: areaName(v.area_id) })),
    ...S.added.map(a => ({ k: "new:" + a.id, label: a.name, sub: "Survey, new place", group: "added" })),
  ].filter(x => !q || normName(x.label + " " + x.sub + " " + (x.cat ? cat(x.cat).group : "") + " " + (x.area || "")).includes(q));
  // Grouped by area in the order of the island sign, after your saved spots.
  const order = ["spots", ...d.areas.map(a => a.id), "", "added"];
  const rank = g => { const i = order.indexOf(order.includes(g) ? g : ""); return i; };
  items.sort((a, b) => rank(a.group) - rank(b.group) || (a.cat ? cat(a.cat).group : "").localeCompare(b.cat ? cat(b.cat).group : "") || a.label.localeCompare(b.label));
  let last = null;
  $("iresults").innerHTML = items.length
    ? items.map((x, i) => {
        const g = order.includes(x.group) ? x.group : "";
        const head = g !== last ? groupHead(g) : ""; last = g;
        return head + `<button class="res" data-i="${i}"><span>${esc(x.label)}</span><span>${esc(x.sub)}</span></button>`;
      }).join("")
    : `<div class="hint">${q ? `Nothing on the map matches "${esc($("iq").value.trim())}".` : "No places on this map yet."}</div>`;
  $("iresults").querySelectorAll(".res").forEach(b => b.onclick = () => { closeSheets(); isl.moved = true; selectMark(items[+b.dataset.i].k, true); });
}

// Why there is no usable position right now, or "" when there is one on the island.
function whyNoFix(){
  if (gpsDenied()) return gps.err.code === 0 ? "This browser can't share your location." : "Location is turned off for Deck Finder.";
  if (!gps.fix) return "Your location isn't known yet. Wait a moment, in the open if you can, and try again.";
  if (!onIsland()) return "You're not on the island yet. This works once you're on " + placeEntry(isl.id).name + ".";
  return "";
}

function openTakeBack(id){
  const sp = islSpots().find(s => s.id === id); if (!sp) return;
  closeSheets();
  isl.back = { id }; isl.sel = null;
  startCompass();            // on iPhone this asks for motion permission, so it must run inside the tap
  wakeOn("back");
  $("iTake").classList.add("on"); $("iTake").textContent = "Stop";
  if (gps.fix && onIsland()){
    isl.moved = true; fitBox(gps.fix.lat, gps.fix.lon, sp.lat, sp.lon, 90);
    if (isl.s < 1) centerOn((gps.fix.lat + sp.lat) / 2, (gps.fix.lon + sp.lon) / 2, 1);
    isl.ty -= 70; applyView();   // keep both above the Take me back panel
  }
  renderIslMarks(); renderBack();
}
function closeBack(){
  if (!isl) return;
  isl.back = null; stopCompass(); wakeOff("back");
  $("iTake").classList.remove("on"); $("iTake").textContent = "Take me back";
  $("iBackPanel").hidden = true; drawOverlay(); renderCard();
}
function renderBack(){
  const p = $("iBackPanel");
  if (!isl || !isl.back){ p.hidden = true; return; }
  const sp = islSpots().find(s => s.id === isl.back.id);
  if (!sp){ closeBack(); return; }
  const f = gps.fix && onIsland() ? gps.fix : null;
  let body;
  if (!f) body = `<small>${esc(whyNoFix() || "Waiting for your location...")}</small>`;
  else {
    const m = distM(f, sp), br = bearingTo(f, sp);
    if (m <= Math.max(8, Math.min(f.acc, 20))) body = `<div class="dist">You're here</div><small>${esc(sp.name)} is right around you.</small>`;
    else {
      const arrow = compass.state === "ok"
        ? `<svg class="arrow" id="bkArrow" viewBox="0 0 64 64" style="transform:rotate(${((br - compass.heading) + 360) % 360}deg)"><circle cx="32" cy="32" r="30" fill="var(--chip)"/><path d="M32 6 L48 46 L32 37 L16 46 Z" fill="var(--accent)"/></svg>` : "";
      const note = compass.state === "ok" ? "Point the top of your phone where you're walking. The arrow points to your spot."
        : compass.state === "waiting" ? "Finding north..."
        : compass.state === "denied" ? "Motion access is off, so there's no arrow. Follow the orange line on the map. To get the arrow on an iPhone: open Settings, tap Apps, tap Safari, turn on Motion & Orientation Access, then close and reopen Deck Finder."
        : "This phone has no compass here, so follow the orange line on the map.";
      body = `<div class="row">${arrow}<div class="grow"><div class="dist">${esc(distText(m))}</div><small>${esc(walkText(m))}. Head ${compassWord(br)}.</small><small>${esc(note)}</small></div></div>`;
      // Far from the spot (1.13.0): add the tram directions when the tram saves walking.
      const plan = m > TRAM_BACK_M ? tramPlan(f, sp) : null;
      // Collapsed to one line by default (1.14.0), so the panel covers no more than about a quarter of the screen.
      if (plan && !plan.walk){
        const open = !!isl.back.tramOpen, w = (plan.w1 ? walkMin(plan.w1) : 0) + (plan.w2 ? walkMin(plan.w2) : 0);
        body += `<button class="tram-h" id="bkTram" aria-expanded="${open}"><span class="grow">🚋 Or take the tram: ${w ? "about " + w + " min walking" : "no walking to the stops"}</span><span class="chev" aria-hidden="true">${open ? "▾" : "▸"}</span></button>`
          + (open ? `<ol class="tsteps">${tramSteps(plan, sp.name).map(x => `<li>${esc(x)}</li>`).join("")}</ol><small>${esc(tramTimesNote(plan))}</small>` : "");
      }
    }
  }
  p.hidden = false;
  p.innerHTML = `<div class="row"><div class="grow"><b>Back to ${esc(sp.name)}</b></div><button class="x" id="bkClose" aria-label="Close Take me back">✕</button></div>${body}`;
  $("bkClose").onclick = closeBack;
  if ($("bkTram")) $("bkTram").onclick = () => { isl.back.tramOpen = !isl.back.tramOpen; renderBack(); };
}
function updateArrow(){
  const a = $("bkArrow"), sp = isl?.back && islSpots().find(s => s.id === isl.back.id);

// ---------- all-aboard countdown on island day ----------
// All aboard is the day's departure time minus trip.allAboard minutes (30 unless changed in the trip editor).
function aboardFor(trip, placeId){
  if (!trip) return null;
  const today = ymd(new Date());
  const x = islandDays(trip).find(x => x.day.date === today && (!placeId || x.place.id === placeId));
  if (!x) return null;
  if (!/^\d{1,2}:\d{2}$/.test(x.day.depart || "")) return { missing: true };
  const mins = Number.isFinite(trip.allAboard) ? trip.allAboard : 30;
  const [y, mo, dd] = x.day.date.split("-").map(Number), [hh, mi] = x.day.depart.split(":").map(Number);
  const at = new Date(y, mo - 1, dd, hh, mi - mins);
  return { at, left: at - Date.now(), depart: x.day.depart };
}
function aboardLine(a){
  if (a.missing) return { text: "Add the departure time in the itinerary to see the all-aboard countdown", cls: "info" };
  const clock = niceTime(String(a.at.getHours()).padStart(2, "0") + ":" + String(a.at.getMinutes()).padStart(2, "0"));
  if (a.left <= 0) return { text: "All aboard time has passed (" + clock + ")", cls: "late", clock };
  const m = Math.ceil(a.left / 60000), h = Math.floor(m / 60), r = m % 60;
  return { text: "All aboard in " + (h ? h + " h" + (r ? " " + r + " min" : "") : m + " min"), cls: m <= 30 ? "late" : m <= 60 ? "warn" : "", clock };
}
function renderAboard(){
  const el = $("iAboard");
  const a = isl && aboardFor(activeTrip(), isl.id);
  if (!a){ el.hidden = true; return; }
  const l = aboardLine(a);
  el.hidden = false; el.className = "aboard " + l.cls;
  el.textContent = l.text + (l.clock && a.left > 0 ? " (" + l.clock + ")" : "");
}

// Take GPS readings for about 5 seconds, average them, and hand back { lat, lon, acc, samples }.
function recordPosition(title, onSave, onBack){
  if (gpsDenied()) return openLocationHelp();
  const token = {}; recording = token;
  const samples = [], started = Date.now();
  const listener = f => samples.push(f);
  gps.listeners.add(listener); gpsStart();
  islandSheet(`<h3>${esc(title)}</h3><div class="hint" style="padding-top:0">Hold still. Recording your position for about 5 seconds...</div>
    <div class="bigcount" id="rcCount">5</div><div class="hint" id="rcN">No readings yet</div><button class="btn ghost" id="rcCancel">Cancel</button>`);
  const done = () => { clearInterval(tick); gps.listeners.delete(listener); if (recording === token) recording = null; };
  $("rcCancel").onclick = () => { done(); onBack(); };
  const tick = setInterval(() => {
    if (recording !== token || !$("rcCount")){ done(); return; }
    const el = Date.now() - started;
    $("rcCount").textContent = Math.max(0, Math.ceil((5000 - el) / 1000));
    $("rcN").textContent = samples.length ? samples.length + (samples.length === 1 ? " reading" : " readings") : (el > 5000 ? "Waiting for a GPS reading..." : "No readings yet");
    if ((el >= 5000 && samples.length) || el >= 15000){
      done();
      if (!samples.length) return weakOrNone(null);
      // Average, trusting precise readings more (weight 1 / accuracy squared).
      let w = 0, lat = 0, lon = 0;
      samples.forEach(s => { const k = 1 / Math.max(1, s.acc) ** 2; w += k; lat += s.lat * k; lon += s.lon * k; });
      const avg = { lat: +(lat / w).toFixed(7), lon: +(lon / w).toFixed(7), acc: Math.round(samples.reduce((a, s) => a + s.acc, 0) / samples.length * 10) / 10, samples: samples.length };
      if (avg.acc > WEAK_GPS_M) return weakOrNone(avg);
      onSave(avg);
    }
  }, 250);
  function weakOrNone(avg){
    islandSheet(`<h3>${esc(title)}</h3>
      <div class="hint" style="padding-top:0">${avg ? `GPS is weak here. Step into the open and try again?<br>This reading is only accurate to about ${esc(String(avg.acc))} meters.` : "No GPS reading came in. Step into the open, away from roofs, and try again."}</div>
      <button class="btn" id="wkTry">Try again</button>
      ${avg ? `<button class="btn ghost" id="wkSave">Save anyway</button>` : ""}
      <button class="btn ghost" id="wkBack">Cancel</button>`);
    $("wkTry").onclick = () => recordPosition(title, onSave, onBack);
    if ($("wkSave")) $("wkSave").onclick = () => onSave(avg);
    $("wkBack").onclick = onBack;
  }
}
function tagVenue(id){
  const v = isl.d.survey.find(x => x.id === id); if (!v) return;
  const S = sv(isl.id), scroll = $("islandBody").scrollTop;
  recordPosition("Recording: " + surveyVenueName(v, S.venues[id]), avg => {
    const r = S.venues[id] || (S.venues[id] = {});
    Object.assign(r, { lat: avg.lat, lon: avg.lon, acc: avg.acc, samples: avg.samples, at: new Date().toISOString() });
    saveSurvey(); renderIslMarks();
    openSurvey("Saved " + surveyVenueName(v, r) + ", within " + avg.acc + " m.");
    $("islandBody").scrollTop = scroll;
  }, () => { openSurvey(); $("islandBody").scrollTop = scroll; });
}

// ---------- Record a walk: a GPS breadcrumb trail for mapping paths ----------
function confirmWalk(){
  if (gpsDenied()) return openLocationHelp();
  islandSheet(`<h3>Record a walk</h3>
    <div class="hint" style="padding-top:0">Walk along the path you want to map. Deck Finder adds a point every 5 seconds, or every 5 meters when you walk faster. The walk shows on the map as a pink line.</div>
    <div class="hint"><b>This keeps the screen on while recording, which uses more battery.</b> Tap Stop when you're done.</div>
    <button class="btn" id="wkStart">Start recording</button>
    <button class="btn ghost" id="wkBack">Back to the list</button>`);
  $("wkBack").onclick = () => openSurvey(null, true);
  $("wkStart").onclick = () => { startWalk(); closeSheets(); };
}
function walkAdd(f){
  if (!rec) return;
  const pts = rec.walk.points, last = pts[pts.length - 1];
  if (last && (f.t <= last[3] || (f.t - last[3] < 5000 && distM({ lat: last[0], lon: last[1] }, f) < 5))) return;
  pts.push([+f.lat.toFixed(6), +f.lon.toFixed(6), Math.round(f.acc * 10) / 10, f.t]);
  saveSurvey(); renderRec(); drawOverlay();
}
function startWalk(){
  if (rec || !isl) return;
  const w = { id: "w" + Date.now(), started: new Date().toISOString(), ended: null, points: [] };
  sv(isl.id).walks.push(w); saveSurvey();
  rec = { placeId: isl.id, walk: w };
  gps.listeners.add(walkAdd); gpsStart(); wakeOn("walk");
  if (gps.fix && Date.now() - gps.fix.t < 5000) walkAdd(gps.fix);
  renderRec();
}
function stopWalk(){
  if (!rec) return;
  gps.listeners.delete(walkAdd); wakeOff("walk");
  const S = sv(rec.placeId);
  rec.walk.ended = new Date().toISOString();
  if (!rec.walk.points.length) S.walks = S.walks.filter(w => w !== rec.walk);   // nothing recorded: drop it
  rec = null; saveSurvey(); renderRec(); drawOverlay();
}
function renderRec(){
  const b = $("iRec");
  if (!rec){ b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `<span class="grow">● Recording a walk: ${rec.walk.points.length} ${rec.walk.points.length === 1 ? "point" : "points"}</span><button id="recStop">Stop</button>`;
  $("recStop").onclick = () => { stopWalk(); if ($("islandSheet").classList.contains("open") && $("svWalk")) openSurvey("Walk saved.", true); };
}

// ---------- Export survey: every recorded venue, rename, doesn't-exist mark, new place and walk ----------
// Saved spots from Save my spot live with the trips and are never part of this.
async function exportSurvey(placeId){
  const S = survey.places[placeId];
  if (!S || !surveyCount(placeId)) return "Nothing recorded in Survey mode yet.";
  let d = null; try { d = await ensurePlace(placeId); } catch (e) {}
  const list = d ? d.survey : [];
  const iso = t => t ? new Date(t).toISOString() : null;
  const out = {
    format: "deckfinder-survey", format_version: 1,
    island: placeEntry(placeId)?.name || placeId, place_id: placeId,
    exported: new Date().toISOString(), app_version: APP_VERSION,
    venues: Object.entries(S.venues || {}).map(([id, r]) => {
      const v = list.find(x => x.id === id) || {};
      const o = { id, list_name: v.name || id, category: v.category || null, confidence: v.confidence || null };
      if (typeof r.lat === "number") Object.assign(o, { lat: r.lat, lon: r.lon, accuracy_m: r.acc, samples: r.samples, recorded: r.at });
      if (r.rename) o.renamed_to = r.rename;
      if (r.missing) o.doesnt_exist = true;
      return o;
    }),
    new_places: (S.added || []).map(a => ({ id: a.id, name: a.name, category: a.category, lat: a.lat, lon: a.lon, accuracy_m: a.acc, samples: a.samples, recorded: a.at })),
    walks: (S.walks || []).filter(w => w.points.length).map(w => ({ id: w.id, started: w.started, ended: w.ended, points: w.points.map(p => ({ lat: p[0], lon: p[1], accuracy_m: p[2], time: iso(p[3]) })) })),
  };
  const name = placeId + ".survey-" + ymd(new Date()) + ".json";
  const text = JSON.stringify(out, null, 1) + "\n";
  // Android app: the WebView can't download or share files, so save it and open the share sheet natively.
  if (IS_APP){
    try {
      const r = await appShareFile(name, text, name);
      return r === "shared" ? "Sent " + name + " to the app you picked." : "Not shared. Tap Export survey to try again.";
    } catch (e) { return "Couldn't share " + name + ". Nothing was saved. Tap Export survey to try again."; }
  }
  const file = typeof File === "function" ? new File([text], name, { type: "application/json" }) : null;
  if (file && navigator.canShare && navigator.share){
    try { if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: name }); return "Shared " + name + "."; } }
    catch (e) { if (e.name === "AbortError") return "Not shared. Tap Export survey to try again."; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return "Saved " + name + " to your downloads.";
}

// ---------- links: the part after # never goes to any server ----------
// #join=<passphrase> is a family invite. #trip=<data> is a shared trip. Both are taken out of the
// address bar and this page's history entry as soon as the app reads them.
function readLinkHash(){
  const m = (location.hash || "").match(/^#(join|trip)=([\s\S]+)$/);
  if (!m) return null;
  try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {}
  return { kind: m[1], value: m[2] };
}

}

function parseSharedTrip(v){
  let o; try { o = JSON.parse(b64uDecode(v)); } catch (e) { return null; }

  if (!o || o.v !== 1 || !catEntry(o.ship) || !ISO.test(o.date)) return null;
  const str = (x, n) => typeof x === "string" ? x.trim().slice(0, n) : "";
  const pct = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 100;
  const t = { ship: o.ship, date: o.date, cabin: cabinDeckNum(o.cabin) ? String(o.cabin).trim() : "", itinerary: null, pins: [] };
  if (t.cabin && o.pin && pct(o.pin.x) && pct(o.pin.y)) t.pin = { x: o.pin.x, y: o.pin.y };
  if (Number.isInteger(o.allAboard) && o.allAboard >= 0 && o.allAboard <= 240) t.allAboard = o.allAboard;
  const it = o.itinerary;
  if (it && Array.isArray(it.days)){
    const days = it.days.slice(0, 60).filter(d => d && ISO.test(d.date)).map(d => d.sea ? { date: d.date, sea: true }
      : Object.assign({ date: d.date, port: str(d.port, 80) || "Port", arrive: HM.test(d.arrive) ? d.arrive : "", depart: HM.test(d.depart) ? d.depart : "" },
        /^[A-Z0-9]{2,6}$/.test(d.code || "") ? { code: d.code } : {}));
    if (days.length){
      t.itinerary = { title: str(it.title, 120) || "Shared itinerary", source: ["ncl", "cruisefeed", "manual"].includes(it.source) ? it.source : "manual",
        fetched: /^\d{4}-\d{2}-\d{2}T/.test(it.fetched || "") ? it.fetched.slice(0, 40) : new Date().toISOString(), days: normalizeDays(days) };
      if (str(it.code, 40)) t.itinerary.code = str(it.code, 40);
      if (str(it.sourceLabel, 80)) t.itinerary.sourceLabel = str(it.sourceLabel, 80);
      if (it.edited === true) t.itinerary.edited = true;
    }
  }
  t.pins = (Array.isArray(o.pins) ? o.pins : []).slice(0, 200)
    .filter(p => p && catEntry(p.ship) && Number.isInteger(p.deck) && pct(p.x) && pct(p.y))
    .map((p, i) => ({ id: /^[\w-]{1,40}$/.test(p.id || "") ? p.id : "p" + Date.now() + "-" + i, ship: p.ship, deck: p.deck, x: p.x, y: p.y,
      label: str(p.label, 40) || "Pin", color: /^#[0-9A-Fa-f]{6}$/.test(p.color || "") ? p.color : PIN_COLORS[0] }));
  // Events (1.12.0): a link from an older version has none.
  t.events = (Array.isArray(o.events) ? o.events : []).slice(0, 100).map((ev, i) => {
    if (!ev || typeof ev !== "object" || !ISO.test(ev.date) || !HM.test(ev.time) || !str(ev.title, 60)) return null;
    const out = { id: /^[\w-]{1,40}$/.test(ev.id || "") ? ev.id : "e" + Date.now() + "-" + i, title: str(ev.title, 60), date: ev.date, time: ev.time,
      remind: Number.isInteger(ev.remind) && ev.remind >= 0 && ev.remind <= REMIND_MAX ? ev.remind : null };
    const p = ev.place;
    if (p && typeof p === "object"){
      if (p.kind === "venue" && catEntry(p.ship) && Number.isInteger(p.deck) && str(p.name, 80)) out.place = { kind: "venue", ship: p.ship, deck: p.deck, name: str(p.name, 80) };
      else if (p.kind === "cabin" && catEntry(p.ship) && cabinDeckNum(p.cabin)) out.place = { kind: "cabin", ship: p.ship, cabin: String(p.cabin).trim() };
      else if (p.kind === "island" && placeEntry(p.island) && /^[\w-]{1,80}$/.test(p.id || "") && str(p.name, 80)) out.place = { kind: "island", island: p.island, id: p.id, name: str(p.name, 80) };
      else if (p.kind === "text" && str(p.text, 80)) out.place = { kind: "text", text: str(p.text, 80) };
    }

}

async function readyChecks(t){

  if (e && e.decks && IS_APP) checks.push({ key: "ship", ok: true, title: shipName(t.ship) + " deck plans", detail: "Built into this app. They open with no internet." });
  else if (e && e.decks){
    const ok = SAVED[t.ship] === e.hash;
    checks.push({ key: "ship", ok, title: shipName(t.ship) + " deck plans saved for offline",
      detail: ok ? "They open with no internet." : SAVED[t.ship] ? "A newer copy is on the website. Tap Fix to download it." : "Not saved on this phone yet. Tap Fix to download them.",
      fix: () => saveShip(t.ship) });
  }
  for (const pl of new Map(islandDays(t).map(x => [x.place.id, x.place])).values()){
    if (IS_APP){ checks.push({ key: "island:" + pl.id, ok: true, title: pl.name + " island map", detail: "Built into this app. It opens with no internet." }); continue; }
    const ok = PLACE_SAVED[pl.id] === pl.hash;
    checks.push({ key: "island:" + pl.id, ok, title: pl.name + " island map saved for offline",
      detail: ok ? "It opens with no internet." : PLACE_SAVED[pl.id] ? "A newer copy is on the website. Tap Fix to download it." : "Not saved on this phone yet. Tap Fix to download it.",

  const noDep = days.filter(d => !d.sea && d.kind !== "debark" && !d.depart);
  checks.push({ key: "times", ok: !!days.length && !noDep.length, title: "Itinerary has departure times", opens: true, fix: () => openTripForm(t.id),
    detail: !days.length ? "No itinerary yet. Tap Fix to look it up or type it in."
      : noDep.length ? "No departure time for " + noDep.map(d => niceDate(d.date)).join(", ") + ". Tap Fix and add it from your cruise documents."
      : "Every day in port has a departure time." });

    detail: loc === "granted" ? "The island map can show where you are." : loc === "denied" ? "Location is turned off for Deck Finder. Tap Fix for the steps to turn it on."
      : loc === "unsupported" ? "This browser can't share your location." : "Deck Finder hasn't asked for it yet. Tap Fix, then tap Allow.",
    fix: loc === "unsupported" ? null : loc === "denied" ? openLocationHelp : askLocation, opens: loc === "denied" });

      : "Couldn't check. Connect to the internet, then tap Fix to check again.",
    fix: info ? (IS_APP ? async () => openOutside(APK_PAGE) : applyUpdate) : async () => {}, opens: !!info && IS_APP });
  const inst = isInstalled();
  checks.push({ key: "installed", ok: inst, title: "Installed on this phone",
    detail: IS_APP ? "This is the Deck Finder app for Android." : inst ? "Deck Finder opens from its own icon." : "It's open in a browser tab. Tap Fix to install it, then open it from its icon.",
    fix: installApp, opens: true });
  return checks;
}

}

// ---------- updates: compare the live version.json with this copy ----------
// The Android app compares with the live website's version.json, not the copy inside the app.
const VERSION_URL = IS_APP ? LIVE_BASE + "version.json" : "version.json";
const newer = (a, b) => {
  const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); }
  return false;
};
let liveInfo = null;
async function fetchVersion(){
  try {
    const r = await fetch(VERSION_URL, { cache: "no-store" });
    if (r.ok) liveInfo = await r.json();
  } catch (e) {}
  return liveInfo;
}
async function checkForUpdate(){
  const info = await fetchVersion();
  const bar = $("updateBar");
  if (info && newer(info.version, APP_VERSION)){
    bar.hidden = false;
    // Android app: the web files are inside the app, so a new version means installing a new app.
    if (IS_APP){ bar.textContent = `A new Android version is available (v${info.version}). Tap to download it.`; return; }
    bar.textContent = `Update available (v${info.version}). Tap to update.`;
    // Start downloading the new version now so the tap is quick.
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(()=>{});
  } else bar.hidden = true;
}
async function applyUpdate(){
  $("updateBar").textContent = "Updating...";
  const reload = () => location.reload();
  setTimeout(reload, 8000); // never leave anyone stuck on "Updating..."
  const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
  if (!reg) return reload();
  navigator.serviceWorker.addEventListener("controllerchange", reload);
  try { await reg.update(); } catch (e) {}
  const activate = w => w.postMessage("SKIP_WAITING");
  if (reg.waiting) return activate(reg.waiting);
  const w = reg.installing;
  if (!w) return reload();
  w.addEventListener("statechange", () => { if (w.state === "installed") activate(w); });
}
$("updateBar").onclick = () => IS_APP ? openOutside(APK_PAGE) : applyUpdate();
checkForUpdate();
let lastFront = 0;
function onForeground(){
  if (IS_APP && Date.now() - lastFront < 1500) return;   // the Android app reports a return twice (page and plugin)
  lastFront = Date.now();
  checkForUpdate(); checkReminders(); renderStrip(); if (catalogReady) refreshReady();
  if (IS_APP) syncNotifs(false);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") onForeground(); });
if (IS_APP){ try { plugin("App")?.addListener("resume", onForeground); } catch (e) {} }

// ---------- what's new ----------
async function openNews(){
  const info = (await fetchVersion()) || { version: APP_VERSION, date: APP_DATE, notes: "" };
  const update = newer(info.version, APP_VERSION);
  $("newsBody").innerHTML = `
    <h3>What's new</h3>
    <div class="hint" style="padding-top:0">Version ${esc(info.version)} (${esc(info.date)})</div>
    <div class="news">${esc(info.notes || "No notes for this version.")}</div>
    ${update ? `<button class="btn" id="nUpdate">${IS_APP ? "Download the new Android version" : "Update to v" + esc(info.version)}</button>` : `<div class="hint">You have the latest version.</div>`}`;
  if (update) $("nUpdate").onclick = () => { closeSheets(); if (IS_APP) openOutside(APK_PAGE); else applyUpdate(); };
  openSheet("newsSheet");
}
</script>
