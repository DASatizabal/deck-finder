# Deck Finder: check every push, publish only if the checks pass, then tag and create a Release.
# Requires: Settings > Pages > Source set to "GitHub Actions".
name: Check and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "CLAUDE.md"
      - "README.md"
      - "NOTES.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: check
        name: Run the release inspector
        run: python3 .github/scripts/check_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect only the app files (no repo notes, tooling, or tools folder)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'CLAUDE.md' --exclude 'NOTES.md' --exclude 'tools' ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [check, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release_notes.md
